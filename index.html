<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fallen House</title>
<meta name="description" content="좀비 아포칼립스 생존 방치형 멀티플레이 웹게임">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;padding:0}</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head><body>
<title>Fallen House</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Italiana&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 연회색 종이 위 초록-청록 하프톤 안개(WebGL), 포스터식 코너 라벨·프레임 장식층, 그 위에 얇은 선의 패널 UI. 데스크톱은 오른쪽 접이식 메뉴, 휴대폰은 하단 탭바. */
:root{
  --bg:#e3e4e1; --fg:#1b1e1d; --fg2:#3c4240; --muted:#666c69;
  --panel:rgba(240,241,238,.9); --panel-solid:#eeefec; --panel2:rgba(255,255,255,.5); --field:#f7f7f5;
  --line:rgba(27,30,29,.16); --line2:rgba(27,30,29,.32);
  --accent:#0f8a70; --accent-deep:#0b5e4d; --on-accent:#f4fbf8; --accent-soft:rgba(15,138,112,.09); --accent-line:rgba(15,138,112,.45);
  --ok:#2f8a4a; --blood:#b3312c; --warn:#a8721a;
  --s0:#7b7f78; --s1:#2f7aa0; --s2:#5f7f2c; --s3:#b8432f;
  --deco:rgba(27,30,29,.08); --deco-strong:rgba(15,138,112,.09);
  --gl-bg:#e3e4e1; --gl-a:#16a383; --gl-b:#0b5e4d; --gl-c:#1b1e1d;
  --f-big:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-thin:"Italiana","Didot",Georgia,serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --navw:248px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#2a2d2c; --fg:#e5e7e4; --fg2:#c5c9c6; --muted:#959b98;
  --panel:rgba(48,52,51,.9); --panel-solid:#323635; --panel2:rgba(255,255,255,.05); --field:#252827;
  --line:rgba(229,231,228,.13); --line2:rgba(229,231,228,.26);
  --accent:#3fcfa9; --accent-deep:#8ee8cf; --on-accent:#0f2a23; --accent-soft:rgba(63,207,169,.1); --accent-line:rgba(63,207,169,.45);
  --ok:#86c98f; --blood:#ec6a5c; --warn:#e2ad55;
  --s0:#a9ada6; --s1:#86bcdb; --s2:#b4cc72; --s3:#f0846e;
  --deco:rgba(229,231,228,.07); --deco-strong:rgba(63,207,169,.08);
  --gl-bg:#2a2d2c; --gl-a:#2fbf98; --gl-b:#9be9d2; --gl-c:#e5e7e4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2a2d2c; --fg:#e5e7e4; --fg2:#c5c9c6; --muted:#959b98;
  --panel:rgba(48,52,51,.9); --panel-solid:#323635; --panel2:rgba(255,255,255,.05); --field:#252827;
  --line:rgba(229,231,228,.13); --line2:rgba(229,231,228,.26);
  --accent:#3fcfa9; --accent-deep:#8ee8cf; --on-accent:#0f2a23; --accent-soft:rgba(63,207,169,.1); --accent-line:rgba(63,207,169,.45);
  --ok:#86c98f; --blood:#ec6a5c; --warn:#e2ad55;
  --s0:#a9ada6; --s1:#86bcdb; --s2:#b4cc72; --s3:#f0846e;
  --deco:rgba(229,231,228,.07); --deco-strong:rgba(63,207,169,.08);
  --gl-bg:#2a2d2c; --gl-a:#2fbf98; --gl-b:#9be9d2; --gl-c:#e5e7e4; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55;margin:0;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.4}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{background:var(--field);border:1px solid var(--line2);color:var(--fg);padding:8px 10px;font:inherit;min-width:0;border-radius:2px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-size:13px;margin:0}
.label{font-size:11px;letter-spacing:.04em;color:var(--muted);font-weight:500}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;color:var(--fg);font-weight:600;text-transform:uppercase;display:flex;align-items:center;flex-wrap:wrap}
.eyebrow::before{content:"";width:7px;height:7px;background:var(--fg);margin-right:9px;flex:none}

/* ---- 배경층 ---- */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;pointer-events:none}
body.no-gl #fx{display:none}
body.no-gl{background:radial-gradient(ellipse at 70% 30%,var(--accent-soft),transparent 60%),var(--bg)}
.deco{position:fixed;top:0;bottom:0;left:0;right:var(--navw);z-index:1;pointer-events:none;overflow:hidden;transition:right .25s ease}
.bigword{position:absolute;left:-.04em;bottom:-.18em;font-family:var(--f-big);font-style:italic;font-weight:400;font-size:min(30vw,440px);line-height:.8;color:transparent;-webkit-text-stroke:1px var(--deco);white-space:nowrap;transform-origin:left bottom;transform:rotate(-90deg) translateY(100%)}
.bignum{position:absolute;right:4%;top:9%;font-family:var(--f-big);font-weight:900;font-size:min(24vw,330px);line-height:.8;color:transparent;background:radial-gradient(circle,var(--deco-strong) 0 1.6px,transparent 2px) 0 0/6px 6px;-webkit-background-clip:text;background-clip:text}
.clabel{position:absolute;font-family:var(--f-mono);font-size:9.5px;font-weight:600;letter-spacing:.06em;color:var(--fg);opacity:.7;display:flex;align-items:center;gap:6px;white-space:nowrap}
.clabel::before{content:"";width:6px;height:6px;background:currentColor}
.cl1{top:max(8px,env(safe-area-inset-top,0px));left:32px}.cl2{top:max(8px,env(safe-area-inset-top,0px));left:50%}.cl3{top:max(8px,env(safe-area-inset-top,0px));right:24px}
.cl4{bottom:12px;left:32px}.cl5{bottom:12px;left:50%}.cl6{bottom:12px;right:24px}
.barcode{position:absolute;bottom:34px;width:22px;height:30px;background:repeating-linear-gradient(90deg,var(--fg) 0 1px,transparent 1px 3px,var(--fg) 3px 5px,transparent 5px 6px);opacity:.45}
.bc1{left:32px}.bc2{right:24px}
.frame{position:absolute;inset:44px 20px 40px 20px;border:1px solid var(--deco)}
.tinytext{max-width:300px;margin:4px 0 6px;font-family:var(--f-mono);font-size:7.5px;line-height:1.35;text-align:justify;color:var(--fg);opacity:.35;text-transform:uppercase}

/* ---- 뼈대 ---- */
.shell{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) var(--navw);height:100%;transition:grid-template-columns .25s ease}
.content{overflow:auto;height:100%;min-width:0;position:relative}
.topbar{position:sticky;top:0;z-index:6;background:linear-gradient(var(--bg) 40%,transparent)}
.tb-row{display:flex;align-items:center;gap:10px;padding-block:max(14px,env(safe-area-inset-top,0px)) 10px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:24px}
.crumb{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;color:var(--muted);display:flex;align-items:center;gap:12px;flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.crumb b{color:var(--fg);font-family:var(--f-body);letter-spacing:0;font-size:13px;font-weight:600}
.pill{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line2);padding:5px 10px;color:var(--fg2);display:flex;align-items:center;gap:7px;white-space:nowrap;background:var(--panel)}
.pill i,.pstat i,.sys i{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
.pill i.off,.pstat i.off,.sys i.off{background:var(--muted)}
.iconbtn{background:none;border:1px solid transparent;color:var(--muted);padding:6px;display:inline-flex;align-items:center;gap:6px;position:relative;border-radius:2px}
.iconbtn:hover{color:var(--fg);border-color:var(--line2)}
.iconbtn em{position:absolute;top:0;right:0;font-style:normal;font-family:var(--f-mono);font-size:9px;background:var(--accent);color:var(--on-accent);border-radius:7px;min-width:14px;padding:0 3px;line-height:14px;text-align:center}
.res{display:flex;gap:6px;flex-wrap:wrap;padding-block:0 10px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:24px}
.chip{display:flex;align-items:baseline;gap:6px;background:var(--panel);border:1px solid var(--line);padding:3px 9px;font-size:12px;color:var(--fg2)}
.chip i{width:6px;height:6px;align-self:center}
.chip b{font-family:var(--f-mono);font-weight:600;font-size:12.5px;color:var(--fg)}
.chip small{color:var(--muted);font-family:var(--f-mono);font-size:10.5px}
.chip.full b{color:var(--accent)}
.chip.zero b{color:var(--blood)}

/* ---- 오른쪽 메뉴 ---- */
.side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:auto;overflow-x:hidden;padding-block:max(18px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:14px;padding-right:max(14px,env(safe-area-inset-right,0px))}
.side-top{display:flex;align-items:center;gap:10px;padding:0 4px 22px}
.lg2{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin:10px 0 4px;font-weight:400;line-height:1}
.lg-tag{font-family:var(--f-mono);font-size:10px;font-weight:500;letter-spacing:.38em;color:#c8392f;white-space:nowrap}
.lg-title{font-family:var(--f-body);font-weight:500;font-size:20px;letter-spacing:.42em;margin-right:-.42em;white-space:nowrap;color:var(--fg);filter:url(#slit);
  -webkit-mask-image:repeating-linear-gradient(180deg,#000 0 .19em,transparent .19em .23em);mask-image:repeating-linear-gradient(180deg,#000 0 .19em,transparent .19em .23em)}
.lg2.sm{gap:6px;margin:0}
.lg2.sm .lg-tag{font-size:9px;letter-spacing:.3em}
.lg2.sm .lg-title{font-size:13px;letter-spacing:.32em;margin-right:0;filter:url(#slitSm);-webkit-mask-image:none;mask-image:none}
body.nav-min .lg2.sm .lg-tag,body.nav-min .lg2.sm .rest{display:none}
body.nav-min .lg2.sm .lg-title{font-size:22px;letter-spacing:0}
.hero .lg-title{font-size:16px;letter-spacing:.38em}
.hero .lg-tag{font-size:9px}
@media (max-width:760px){.lg-title{font-size:16px;letter-spacing:.32em}.lg-tag{letter-spacing:.24em;font-size:9px}}
.logo{display:flex;flex-direction:column;flex:1;min-width:0;line-height:1;padding-left:2px}
.logo .lt{font-family:var(--f-big);font-weight:800;font-size:30px;letter-spacing:-.01em;white-space:nowrap;font-optical-sizing:auto}
.logo .lt .ht{color:transparent;background:radial-gradient(circle,var(--fg) 0 .9px,transparent 1.15px) 0 0/3px 3px;-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:.6px var(--fg)}
.logo .lt .bl{color:var(--accent);filter:blur(1.4px)}
.logo .ls{font-family:var(--f-thin);font-size:17px;letter-spacing:.08em;margin-top:-2px;white-space:nowrap}
.logo .ls small{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.14em;color:var(--muted);margin-left:6px}
body.nav-min .logo .lt{font-size:22px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-g{font-size:11px;letter-spacing:.06em;color:var(--muted);padding:14px 10px 6px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.nav-g::after{content:"";flex:1;height:1px;background:var(--line)}
.nav-g:first-child{padding-top:0}
.nav-i{display:flex;align-items:center;gap:12px;padding:9px 12px;border:1px solid transparent;background:none;color:var(--fg2);text-align:left;font-size:13.5px;position:relative;white-space:nowrap}
.nav-i:hover{background:var(--accent-soft);color:var(--fg)}
.nav-i.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:600}
.nav-i.on::after{content:"";position:absolute;right:-1px;top:8px;bottom:8px;width:2px;background:var(--accent)}
.nav-i span{flex:1}
.nav-i .code{font-family:var(--f-mono);font-size:9.5px;color:var(--muted);letter-spacing:.1em;font-weight:500}
.nb{font-style:normal;font-family:var(--f-mono);font-size:10px;min-width:18px;padding:1px 5px;text-align:center;border:1px solid var(--line2);color:var(--muted)}
.nb.hot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.side-foot{margin-top:auto;padding:20px 4px 0;display:flex;flex-direction:column;gap:12px}
.sys{font-size:11.5px;color:var(--ok);display:flex;align-items:center;gap:8px;white-space:nowrap}
.sys-t{font-size:11.5px;color:var(--muted);line-height:1.7;margin:0}
.profile{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.profile div{flex:1;min-width:0}
.profile b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile small{font-size:11px;color:var(--muted);white-space:nowrap}
body.nav-min{--navw:72px}
body.nav-min .side .logo .ls,body.nav-min .logo .lt .rest,body.nav-min .nav-i span,body.nav-min .nav-i .code,body.nav-min .side-foot .sys-t,body.nav-min .profile div,body.nav-min .sys span{display:none}
body.nav-min .nav-g{font-size:0;padding:10px 6px}
body.nav-min .nav-i{justify-content:center;padding:10px 0}
body.nav-min .nav-i .nb{position:absolute;top:2px;right:4px;min-width:0;padding:0 4px;font-size:9px}
body.nav-min .side-top{flex-direction:column;padding-bottom:14px}
body.nav-min .profile{justify-content:center}
body.nav-min .sys{justify-content:center}

/* ---- 하단 탭바(휴대폰) ---- */
.tabbar{display:none}
.sheet{display:none}

/* ---- 본문 ---- */
.view{padding-block:26px 60px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:24px;max-width:1360px;display:flex;flex-direction:column;gap:20px}
.view.ink-in{animation:inkin .55s cubic-bezier(.2,.7,.2,1)}
@keyframes inkin{from{opacity:0;clip-path:inset(0 0 100% 0);transform:translateY(14px)}60%{opacity:1}to{opacity:1;clip-path:inset(0 0 0 0);transform:none}}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:4px}
.phead h1{font-size:30px;font-weight:700;margin:6px 0 6px;line-height:1.1;display:flex;align-items:baseline;gap:12px;text-wrap:balance}
.pidx{font-family:var(--f-big);font-weight:900;font-size:22px;color:var(--accent)}
.phead p{margin:0;color:var(--fg2);font-size:13.5px;max-width:60ch}
.pstat{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--panel);padding:8px 13px;font-size:12px;color:var(--fg2)}

.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;padding:6px 0 4px;align-items:center;position:relative}
.hero-l{display:flex;flex-direction:column;gap:8px;min-width:0;position:relative;z-index:1}
.eyebrow .dash{display:inline-block;width:28px;height:1px;background:currentColor;vertical-align:middle;margin:0 10px}
.ftitle{position:relative;margin:10px 0 2px;line-height:.86;display:flex;flex-direction:column;align-items:flex-start;width:max-content;max-width:100%}
.ft-main{font-family:var(--f-big);font-weight:800;font-size:clamp(46px,5.4vw,78px);letter-spacing:-.02em;color:var(--fg);font-optical-sizing:auto;white-space:nowrap}
.ft-main .ht{color:transparent;background:radial-gradient(circle,var(--fg) 0 .95px,transparent 1.25px) 0 0/3px 3px;-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:1.2px var(--fg)}
.ft-main .gl{position:relative;display:inline-block;color:var(--accent);filter:blur(1.8px);text-shadow:0 0 10px var(--accent)}
.ft-sub{font-family:var(--f-thin);font-size:clamp(22px,2.3vw,32px);letter-spacing:.04em;align-self:center;margin-top:-.08em;color:var(--fg)}
.fbox{position:absolute;border:1px solid var(--fg);pointer-events:none;opacity:.75}
.fbox::before,.fbox::after{content:"";position:absolute;width:6px;height:6px;background:var(--fg)}
.fbox.b1{left:-3%;top:2%;width:44%;height:58%}.fbox.b1::before{right:-4px;top:-4px}.fbox.b1::after{display:none}
.fbox.b2{right:-4%;top:10%;width:24%;height:62%}.fbox.b2::before{right:-4px;bottom:-4px}.fbox.b2::after{left:-4px;top:-4px}
.hero-s{font-size:16px;margin:10px 0 0;font-weight:600;text-wrap:balance}
.hero-p{color:var(--fg2);font-size:13.5px;line-height:1.8;margin:0 0 12px;max-width:46ch}
.hero-r{position:relative;min-width:0;display:flex;flex-direction:column;gap:12px}
.cubebox{position:relative;width:100%;aspect-ratio:1/1;max-height:440px}
.cubebox canvas{position:absolute;inset:0;width:100%;height:100%}
.cubebox .clabel{opacity:.8}
.clock{font-family:var(--f-big);font-weight:800;font-size:clamp(34px,4vw,54px);line-height:.95;font-optical-sizing:auto}
.clock small{font-family:var(--f-mono);font-size:11px;color:var(--accent);letter-spacing:.14em;margin-right:10px;font-weight:600;vertical-align:middle}
.hstat{display:grid;grid-template-columns:repeat(4,auto);gap:2px 18px;font-size:11.5px;border-top:1px solid var(--line2);padding-top:10px}
.hstat span{color:var(--muted)}
.hstat b{font-family:var(--f-mono);font-weight:600;grid-row:2}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.pcard,.card,.job,.big-action,.item,.gift,.roster,.welcome,.chatlog{backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2)}
.pcard{background:var(--panel);border:1px solid var(--line);padding:22px 24px;display:flex;flex-direction:column;gap:12px;min-width:0;position:relative}
.pcard::before,.pcard::after{content:"";position:absolute;width:6px;height:6px;background:var(--fg)}
.pcard::before{top:-3px;left:-3px}.pcard::after{bottom:-3px;right:-3px}
.pc-h{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.pc-h h3{font-size:14.5px;margin:0;flex:1;font-weight:700}
.pc-h .ic{color:var(--accent)}
.tagx{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;border:1px solid var(--line2);padding:3px 8px;color:var(--muted)}
.tagx.ok{color:var(--ok);border-color:var(--ok)}
.tagx.red{color:var(--blood);border-color:var(--blood)}
.me-row{display:flex;align-items:center;gap:12px}
.me-row div{flex:1;min-width:0}
.me-row b{font-size:15px}
.me-ic{width:38px;height:38px;border:1px solid var(--accent-line);display:grid;place-items:center;color:var(--accent);border-radius:50%}
.lvbox{border:1px solid var(--line2);background:var(--panel2);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.lv{font-family:var(--f-big);font-weight:900;font-size:36px;color:var(--accent);line-height:.9}
.lv small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:400;margin-left:8px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats b{font-size:17px}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:8px;align-self:flex-start;margin-top:auto}
.linkbtn .ic{width:15px;height:15px}

.m-ac path{stroke:var(--m-rc);stroke-width:8}.m-ad path{stroke:var(--m-rd);stroke-width:5.5}

/* ===== 이벤트 연출 ===== */
#fxl{position:fixed;inset:0;z-index:300;pointer-events:none}
#fxl .fx-flash{position:absolute;inset:0;opacity:0}
#fxl .fx-vig{position:absolute;inset:0;opacity:0;transition:opacity .8s;background:radial-gradient(ellipse at center,transparent 62%,var(--vc,rgba(140,10,10,.85)) 140%)}
#fxl .fx-static{position:absolute;inset:0;width:100%;height:100%;opacity:0;image-rendering:pixelated;mix-blend-mode:screen;transition:opacity .15s}
#fxl .fx-black{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .9s;display:grid;place-items:center}
#fxl .fx-black.on{opacity:1;pointer-events:auto;transition:opacity .6s}
#fxl .fx-txt{color:#d9d9d9;font-family:var(--f-mono);letter-spacing:.2em;font-size:15px;margin:0;opacity:.9}
#fxl .fx-txt.glitch{animation:glt .35s steps(2) infinite}
@keyframes glt{0%{transform:translate(0);text-shadow:2px 0 #f33,-2px 0 #3ff}50%{transform:translate(-2px,1px);text-shadow:-2px 0 #f33,2px 0 #3ff}100%{transform:translate(1px,-1px)}}
.fx-shake{animation:fxshk .45s cubic-bezier(.36,.07,.19,.97) both}
@keyframes fxshk{10%,90%{transform:translate(calc(var(--shk)*-.3),0)}20%,80%{transform:translate(calc(var(--shk)*.5),calc(var(--shk)*-.2))}30%,50%,70%{transform:translate(calc(var(--shk)*-1),calc(var(--shk)*.3))}40%,60%{transform:translate(var(--shk),calc(var(--shk)*-.3))}}
.fx-flick{animation:fxfl 1.4s ease-in-out}
@keyframes fxfl{0%,100%{filter:none}45%{filter:brightness(.72)}}
@media (prefers-reduced-motion:reduce){.fx-shake,.fx-flick,#fxl .fx-txt.glitch,.me-halo{animation:none}}
.citymap.nav .m-dist rect{stroke:none}

  if(!rt.db||!rt.myId) return;
  if(rt.pubBusy){rt.pubDirty=true;return}
  rt.pubBusy=true;
  const doc=pubDoc();
  try{ await rt.db.doc('players/'+rt.myId).set(doc); rt.players.set(rt.myId,doc) }
  catch(e){ if(e&&e.code==='quota_exceeded') toast('서버 저장 공간이 가득 찼습니다.'); }
  rt.pubBusy=false;
  if(rt.pubDirty){rt.pubDirty=false;flushPub()}
  renderAside();
}
function feed(x){S.feed.push({t:Date.now(),x:String(x).slice(0,140)}); S.feed=S.feed.slice(-8); schedulePub(1500)}

/* ================= 보상 ================= */
function rollCol(rar){
  let r=Math.random(),tier=0; for(let i=0;i<4;i++){ if(r<rar[i]){tier=i;break} r-=rar[i]; tier=i }
  const items=SETS[tier].items; const k=items[ri(0,items.length-1)][0];
  return k;
}
function giveCol(k,src){
  const first=!(S.col[k]>0); S.col[k]=(S.col[k]||0)+1; const c=COL[k];
  toast(`${first?'새 수집품':'수집품'}: ${c.n}${first?'':' (중복)'}`, c.set>=2);
  if(first&&c.set>=2) feed(`${S.nick}님이 ${src}에서 「${c.n}」을(를) 찾았습니다`);
  if(first&&setDone(c.set)){toast(`세트 완성: ${SETS[c.set].n} · ${SETS[c.set].bonus}`,true); feed(`${S.nick}님이 「${SETS[c.set].n}」 세트를 완성했습니다`)}
}
function addXp(n){n*=1+buffV('xp'); const l0=lvlOf(S.xp); S.xp+=n; const l1=lvlOf(S.xp); if(l1>l0){toast(`레벨 ${l1} 달성`,true); sfx('level'); feed(`${S.nick}님이 레벨 ${l1}이 되었습니다`); for(let l=l0+1;l<=l1;l++) onLevel(l)}}
function lootText(o){return Object.entries(o).filter(([,v])=>v>0).map(([k,v])=>`${RES[k].n} +${v}`).join(', ')}

const ACT={
  tab(el){setTab(el.dataset.tab)},
  scav(){
    const now=Date.now(); if(now-S.scavT<3500) return; S.scavT=now;
    const o={}; const n=ri(1,2); for(let i=0;i<n;i++){const k=BASIC[ri(0,3)]; const q=ri(2,5)*(S.route==='solo'?2:1); o[k]=(o[k]||0)+q; gain(k,q)}
    if(Math.random()<.04){const k=Math.random()<.5?'fuel':'med';o[k]=1;gain(k,1)}
    addXp(1); toast('주변 수색: '+lootText(o)); markSave(); render();
  },
  job(el){
    const k=el.dataset.k, d=+el.dataset.d; const free=S.workers-busyWorkers()-assigned();
    if(d>0&&free<=0) return; if(d<0&&S.jobs[k]<=0) return;
    S.jobs[k]+=d; markSave(); render();
  },
  build(el){
    const k=el.dataset.k, l=S.bld[k]; if(l>=BLD_MAX) return; const c=costOf(BLD[k].base,l); if(!canPay(c)) return;
    pay(c); S.bld[k]++; addXp(8+l*4); toast(`${BLD[k].n} ${S.bld[k]}단계 완공`); markSave(); schedulePub(4000); render();
  },
  craft(el){
    const r=RECIPES.find(x=>x.k===el.dataset.k); const n=+(el.dataset.n||1);
    for(let i=0;i<n;i++){ if(!canPay(r.cost)) break; pay(r.cost); S.inv[r.k]++; S.crafted=S.crafted||{}; S.crafted[r.k]=(S.crafted[r.k]||0)+1; addXp(r.xp) }
    toast(`${r.n} 제작 완료 (보유 ${S.inv[r.k]})`); markSave(); render();
  },
  recruit(){
    const c=recruitCost(); if(!canPay(c)) return; pay(c); S.workers++; addXp(20);
    toast('무전에 응답한 생존자가 캠프에 합류했다. 일꾼 +1',true); feed(`${S.nick}님의 캠프에 새 생존자가 합류했습니다 (일꾼 ${S.workers}명)`);
    markSave(); render();
  },
  explore(el){
    const z=ZONES.find(x=>x.k===el.dataset.k); if(S.bld.radio<z.req) return;
    if(S.exp.length>=expSlots()) return toast('동시에 보낼 수 있는 탐험대가 없습니다.');
    if(S.workers-busyWorkers()-assigned()<=0) return toast('쉬는 일꾼이 없습니다. 작업 배치에서 한 명을 빼 주세요.');
    const em=evZone(z); if(em.block) return toast(`${z.n}: 지금은 아무도 보낼 수 없습니다 (${curEv().title}).`);
    const c=expCost(z); if(!canPay(c)) return; pay(c);
    let dur=z.min*60000*em.time*(S.route==='duo'?.9:1); if(setDone(1)) dur*=.85; let drone=false; if(S.inv.drone>0){S.inv.drone--;dur*=.5;drone=true}
    S.exp.push({z:z.k,s:Date.now(),e:Date.now()+dur,drone,lm:em.loot,cb:em.col,rm:em.res}); toast(`${z.n}(으)로 탐험대 출발${drone?' · 드론 사용':''}`); markSave(); render();
  },
  collect(el){
    const i=+el.dataset.i, x=S.exp[i]; if(!x||Date.now()<x.e) return; const z=ZONES.find(q=>q.k===x.z);

    for(const k in z.loot){const q=Math.max(0,Math.round(ri(z.loot[k][0],z.loot[k][1])*(x.lm||1)*((x.rm&&x.rm[k])||1))); o[k]=q; gain(k,q)}
    addXp(Math.ceil(z.min/2)+2); toast(`${z.n} 귀환: ${lootText(o)||'빈손으로 돌아왔다'}`);
    if(Math.random()<z.col+(x.cb||0)) giveCol(rollCol(z.rar),z.n);
    markSave(); schedulePub(5000); render(); setTimeout(()=>maybeStory(.3),900);
  },
  defense(){openDefenseSetup()},
  lock(){ if(S.inv.pick<=0) return toast('자물쇠 따개가 없습니다. 제작 탭에서 만들 수 있습니다.'); openLock() },
  molotov(){
    if(S.inv.molotov<=0) return; S.inv.molotov--; const d=Math.round(150*raidMult()); S.raid.dmg+=d;
    toast(`화염병 투척: 습격 무리에 ${d} 피해`); markSave(); schedulePub(1500); render();
  },
  support(){
    if((S.res.scrap||0)<8) return; const now=Date.now(); if(now-(rt.supT||0)<3000) return; rt.supT=now;
    S.res.scrap-=8; const d=Math.round(20*raidMult()); S.raid.dmg+=d; addXp(1); toast(`지원 사격: ${d} 피해`); markSave(); schedulePub(5000); render();
  },
  raidClaim(){
    const rid=raidId(); if(S.raidClaimed[rid]||S.raid.dmg<=0||raidTotal()<raidHp()) return;
    S.raidClaimed[rid]=1; const ks=Object.keys(S.raidClaimed).map(Number).sort((a,b)=>b-a).slice(0,10); S.raidClaimed={}; ks.forEach(k=>S.raidClaimed[k]=1);
    const share=Math.min(1,S.raid.dmg/raidHp()); const o={fuel:3+Math.round(share*8),elec:2+Math.round(share*6),med:2,scrap:30};
    for(const k in o) gain(k,o[k]); addXp(25); toast('습격 격퇴 보상: '+lootText(o),true);
    if(Math.random()<.35+share*.4) giveCol(rollCol([.1,.3,.4,.2]),'습격 전리품');
    markSave(); render();
  },
  drop(el){claimDrop(el.dataset.i)},
  gift(el){openGift(el.dataset.id)},
  cheer(el){
    const id=el.dataset.id; const now=Date.now();
    if(S.cheers.some(c=>c.to===id&&now-c.t<30*60000)) return toast('이 생존자는 30분 안에 이미 격려했습니다.');
    S.cheers.push({to:id,t:now}); S.cheers=S.cheers.slice(-20); addXp(2); toast(`${nameOf(id)}님을 격려했습니다. 15분 동안 생산 +5%`);
    markSave(); schedulePub(500); render();
  },
  claimGift(el){
    const g=findGift(el.dataset.id); if(!g||S.giftsClaimed.includes(g.id)) return;
    S.giftsClaimed.push(g.id); S.giftsClaimed=S.giftsClaimed.slice(-120);
    if(g.c&&COL[g.c]) giveCol(g.c,'선물'); else if(g.r&&RES[g.r]) {gain(g.r,clamp(g.q|0,1,500)); toast(`${nameOf(g.from)}님의 선물: ${RES[g.r].n} +${clamp(g.q|0,1,500)}`)}
    markSave(); render();
  },
  rename(){openRename()},
  closeModal(){closeModal()},
};

/* ================= 공유: 플레이어/채팅 ================= */
function nameOf(id){ if(id===rt.myId) return S.nick; const p=rt.players.get(id); return p&&typeof p.nick==='string'?p.nick.slice(0,20):'알 수 없는 생존자' }
function raidTotal(){
  const rid=raidId(); let t=0;
  for(const [id,p] of rt.players){ if(id===rt.myId) continue; if(p.raid&&p.raid.id===rid) t+=clamp(+p.raid.dmg||0,0,1e6) }
  return t+(S.raid.id===rid?S.raid.dmg:0);
}
function findGift(gid){ for(const [id,p] of rt.players){ if(!Array.isArray(p.gifts)) continue; const g=p.gifts.find(x=>x&&x.id===gid&&x.to===rt.myId); if(g) return {...g,from:id} } return null }
function myGifts(){
  const out=[]; if(!rt.myId) return out;
  for(const [id,p] of rt.players){ if(id===rt.myId||!Array.isArray(p.gifts)) continue;
    for(const g of p.gifts) if(g&&g.to===rt.myId&&typeof g.id==='string'&&!S.giftsClaimed.includes(g.id)) out.push({...g,from:id}) }
  return out;
}
function sendChat(text){
  text=text.trim().replace(/\s+/g,' ').slice(0,140); if(!text) return;
  const now=Date.now(); if(now-rt.lastChat<1500) return toast('조금 천천히 보내 주세요.'); rt.lastChat=now;
  S.chat.push({t:now,x:text}); S.chat=S.chat.slice(-12); saveLocal(); flushPub(); renderChat(true);
}

/* ================= 배경 셰이더 (WebGL) ================= */
const FX=(()=>{
  const cv=$('fx'); let gl=null;
  const low=matchMedia('(max-width:760px), (pointer:coarse)').matches||(navigator.hardwareConcurrency||8)<=4||(navigator.deviceMemory||8)<=4;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const api={tier:low?'low':'high',pulse(){},theme(){},resize(){}};
  try{gl=cv.getContext('webgl',{antialias:false,alpha:false,depth:false,stencil:false,powerPreference:low?'low-power':'high-performance'})}catch(e){}
  if(!gl){document.body.classList.add('no-gl');return api}
  const VS='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  const FS=`#define OCT ${low?3:5}
precision ${low?'mediump':'highp'} float;
uniform vec2 uRes,uM;uniform float uT,uPulse,uDark,uScale;uniform vec3 uBg,uA,uB,uC;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;mat2 m=mat2(1.6,1.2,-1.2,1.6);for(int i=0;i<OCT;i++){v+=a*n(p);p=m*p;a*=.5;}return v;}
void main(){
  float s=min(uRes.x,uRes.y);
  vec2 p=(gl_FragCoord.xy-.5*uRes)/s;
  vec2 m=(uM-.5)*uRes/s;
  vec2 uv=gl_FragCoord.xy/uRes;
  float t=uT*.022;
  vec2 q=vec2(fbm(p*1.1+vec2(0.,t)),fbm(p*1.1+vec2(5.2,1.3)-t));
  float w=2.2+uPulse*3.2;
  float f=fbm(p*1.5+w*q+vec2(t*1.3,-t));
  float mask=(1.-smoothstep(-.05,.75,uv.y))*.95+smoothstep(.4,1.,uv.x)*(1.-smoothstep(.2,.95,uv.y))*.6+.4*exp(-5.*length(p-m))+uPulse*.25;
  float dens=clamp((f-.38)*1.5*mask,0.,1.);
  vec2 gp=mat2(.7071,-.7071,.7071,.7071)*(gl_FragCoord.xy/(6.*uScale));
  vec2 gc=fract(gp)-.5;
  float r=sqrt(dens)*.64;
  float dotv=1.-smoothstep(r-.09,r+.09,length(gc));
  vec3 col=uBg;
  col=mix(col,uA,dens*.14);
  col=mix(col,uB,dotv*smoothstep(.08,.4,dens)*.3);
  float g=h(floor(gl_FragCoord.xy/max(uScale,.5))+floor(uT*8.)*.13);
  col+=(g-.5)*(uDark>.5?.03:.025);
  float scr=smoothstep(.985,1.,n(vec2(gl_FragCoord.x/uScale*.015+floor(uT*.5),gl_FragCoord.y/uScale*.9)));
  col=mix(col,uC,scr*.06);
  gl_FragColor=vec4(col,1.);
}`;
  const sh=(t,src)=>{const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s};
  let pr;
  try{pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw new Error('link')}
  catch(e){document.body.classList.add('no-gl');return api}
  gl.useProgram(pr);
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const U={};for(const k of ['uRes','uM','uT','uPulse','uDark','uScale','uBg','uA','uB','uC'])U[k]=gl.getUniformLocation(pr,k);
  let scale=low?.34:Math.min(devicePixelRatio||1,1.5), pulse=0, mx=.75, my=.5, tx=.75, ty=.5, last=0, ema=16, raf=0;
  const hex=v=>{v=(v||'').trim().replace('#','');if(v.length===3)v=v.split('').map(c=>c+c).join('');const n=parseInt(v,16)||0;return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]};
  function theme(){
    const cs=getComputedStyle(document.documentElement);
    const bg=hex(cs.getPropertyValue('--gl-bg'));
    gl.uniform3fv(U.uBg,bg);gl.uniform3fv(U.uA,hex(cs.getPropertyValue('--gl-a')));gl.uniform3fv(U.uB,hex(cs.getPropertyValue('--gl-b')));gl.uniform3fv(U.uC,hex(cs.getPropertyValue('--gl-c')));
    gl.uniform1f(U.uDark,(bg[0]+bg[1]+bg[2])/3<.5?1:0);
    if(reduce) draw(performance.now());
  }
  function resize(){cv.width=Math.max(1,Math.round(innerWidth*scale));cv.height=Math.max(1,Math.round(innerHeight*scale));gl.viewport(0,0,cv.width,cv.height);gl.uniform2f(U.uRes,cv.width,cv.height);gl.uniform1f(U.uScale,scale);if(reduce)draw(performance.now())}
  function draw(now){gl.uniform1f(U.uT,now/1000);gl.uniform1f(U.uPulse,pulse);gl.uniform2f(U.uM,mx,my);gl.drawArrays(gl.TRIANGLES,0,3)}
  function frame(now){
    raf=requestAnimationFrame(frame);
    if(document.hidden||!$('def').hidden) return;
    const dt=now-last; if(low&&dt<32) return; last=now;
    if(!low&&dt<200){ema=ema*.94+dt*.06; if(ema>24&&scale>.5){scale=Math.max(.5,scale*.85);resize();ema=16}}
    pulse*=Math.pow(.12,Math.min(dt,100)/1000); mx+=(tx-mx)*.04; my+=(ty-my)*.04;
    draw(now);
  }
  addEventListener('resize',resize);
  if(!low) addEventListener('pointermove',e=>{tx=e.clientX/innerWidth;ty=1-e.clientY/innerHeight},{passive:true});
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',theme);
  new MutationObserver(theme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  resize(); theme();
  if(reduce) draw(performance.now()); else raf=requestAnimationFrame(frame);
  api.pulse=()=>{pulse=1;if(reduce)draw(performance.now())}; api.theme=theme; api.resize=resize;
  return api;
})();

}

    ${dead?(S.raid.dmg>0?`<button class="btn pri" data-act="raidClaim" ${claimed?'disabled':''}>${claimed?'보상 받음':'격퇴 보상 받기'}</button>`:'<p class="muted">이번 습격에는 참여하지 않았습니다.</p>')

const Cube=(()=>{
  const low=FX.tier==='low', reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let cv=null, raf=0, last=0;
  const P=new Uint8Array(512); {let sd=11; const a=[...Array(256).keys()]; for(let i=255;i>0;i--){sd=(sd*16807)%2147483647; const j=sd%(i+1); [a[i],a[j]]=[a[j],a[i]]} for(let i=0;i<512;i++)P[i]=a[i&255]}
  const vn=(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const g=(i,j)=>P[(P[(xi+i)&255]+yi+j)&255]/255; return (g(0,0)*(1-u)+g(1,0)*u)*(1-v)+(g(0,1)*(1-u)+g(1,1)*u)*v};
  function draw(now){
    if(!cv||!document.contains(cv)) return; const r=cv.getBoundingClientRect(); if(!r.width) return;
    const dpr=Math.min(devicePixelRatio||1,low?1:2), W=r.width, H=r.height;
    if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
    const c=cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,W,H);
    const cs=getComputedStyle(document.documentElement), acc=cs.getPropertyValue('--accent').trim(), deep=cs.getPropertyValue('--accent-deep').trim(), fg=cs.getPropertyValue('--fg').trim();
    const t=reduce?3:now/1000, cx=W/2, cy=H*.5, S=Math.min(W,H)*.32;
    c.save(); for(const [ox,oy,rr,al] of [[0,-.1,1.3,.32],[.35,.9,1.5,.28],[-.5,.4,.9,.2]]){const gr=c.createRadialGradient(cx+ox*S,cy+oy*S,0,cx+ox*S,cy+oy*S,rr*S); gr.addColorStop(0,acc); gr.addColorStop(1,'transparent'); c.globalAlpha=al; c.fillStyle=gr; c.fillRect(0,0,W,H)} c.restore();
    const cell=low?7:5;
    for(let y=cy-S*1.6;y<H;y+=cell) for(let x=cx-S*1.7;x<cx+S*1.7;x+=cell){
      const nx=(x-cx)/S, ny=(y-cy)/S;
      const wx=nx+.45*vn(nx*1.7+t*.1,ny*1.7), wy=ny+.45*vn(nx*1.7+5.3,ny*1.7-t*.08);
      const env=Math.exp(-((wx*wx)/.85+((wy-.1)*(wy-.1))/1.1));
      const nn=.65*vn(wx*2.4+t*.16,wy*2.4-t*.12)+.35*vn(wx*5.1-t*.2,wy*5.1);
      let d=env*(.15+1.25*nn)-.18+(ny>.7?.35*nn*(ny-.7):0); if(d<=.04) continue; d=Math.min(1,d);
      c.fillStyle=d>.62?deep:acc; const rr=cell*.56*Math.sqrt(d);
      if(low) c.fillRect(x-rr,y-rr,rr*2,rr*2); else {c.beginPath(); c.arc(x,y,rr,0,6.283); c.fill()}
    }
    const ay=reduce?.6:t*.22, ax=-.38, f=6, k=S*.98;
    const pr=(x,y,z)=>{let X=x*Math.cos(ay)-z*Math.sin(ay), Z=x*Math.sin(ay)+z*Math.cos(ay); let Y=y*Math.cos(ax)-Z*Math.sin(ax); Z=y*Math.sin(ax)+Z*Math.cos(ax); const q=f/(f+Z); return [cx+X*k*q, cy+Y*k*q]};
    c.strokeStyle=fg; c.globalAlpha=.75; c.lineWidth=1;
    const seg=(a,b)=>{const A=pr(...a),B=pr(...b); c.beginPath(); c.moveTo(A[0],A[1]); c.lineTo(B[0],B[1]); c.stroke()};
    const v=[-1,1];
    for(const a of v)for(const b of v){seg([-1,a,b],[1,a,b]);seg([a,-1,b],[a,1,b]);seg([a,b,-1],[a,b,1])}
    for(const a of v){seg([-1,0,a],[1,0,a]);seg([a,0,-1],[a,0,1]);seg([0,-1,a],[0,1,a]);seg([0,a,-1],[0,a,1])}
    c.globalAlpha=1; c.fillStyle=fg; for(const pnt of [[1,-1,1],[-1,1,-1],[1,0,-1]]){const q=pr(...pnt); c.fillRect(q[0]-3,q[1]-3,6,6)}
  }
  function loop(now){ raf=requestAnimationFrame(loop); if(!cv||!document.contains(cv)){cancelAnimationFrame(raf);raf=0;return}
    if(document.hidden||!$('def').hidden||now-last<33) return; last=now; draw(now) }
  new MutationObserver(()=>draw(performance.now())).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>draw(performance.now()));
  addEventListener('resize',()=>draw(performance.now()));

})();

const Intro=(()=>{
  let el=null, actx=null, sound=true, token=0, replay=false, skipT=null, nodes=[];
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const $i=id=>el.querySelector('#'+id);
  /* ---- 소리 ---- */
  function audio(){ if(actx||!sound) return; try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){actx=null} }
  function tone(type,f,t0,dur,vol){const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.02);g.gain.setValueAtTime(vol,t0+dur-.03);g.gain.linearRampToValueAtTime(0,t0+dur);o.connect(g).connect(actx.destination);o.start(t0);o.stop(t0+dur+.02);nodes.push(o)}
  /* 공간 잔향 (열람실) */
  let bus=null;
  function room(){
    if(bus) return bus; bus=actx.createGain(); bus.connect(actx.destination);
    const len=Math.floor(actx.sampleRate*1.6), ir=actx.createBuffer(2,len,actx.sampleRate);
    for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.5)}
    const cv=actx.createConvolver(); cv.buffer=ir; const wet=actx.createGain(); wet.gain.value=.35; bus.connect(cv).connect(wet).connect(actx.destination); return bus;
  }
  /* 도시 전체에 울리는 전동식 공습 사이렌(불가리아 민방위 사이렌 느낌): 낮게 돌기 시작해 길게 오르내리며 운다 */
  function airSiren(dur,vol){
    const t=actx.currentTime+.05, sr=60, N=Math.ceil(dur*sr), curve=new Float32Array(N);
    for(let i=0;i<N;i++){ const x=i/sr; let f;
      if(x<4.5) f=45*Math.pow(300/45,x/4.5);
      else { const ph=((x-4.5)%7.5)/7.5; f=ph<.55?300+170*Math.sin(ph/.55*Math.PI/2):470-170*(1-Math.cos((ph-.55)/.45*Math.PI/2)); }
      if(x>dur-4) f*=Math.pow(.25,(x-(dur-4))/4);
      curve[i]=f }
    const out=actx.createGain(); out.gain.setValueAtTime(0,t); out.gain.linearRampToValueAtTime(vol,t+3); out.gain.setValueAtTime(vol,t+dur-3.5); out.gain.linearRampToValueAtTime(0,t+dur);
    const rot=actx.createGain(), rl=actx.createOscillator(), rg=actx.createGain(); rl.frequency.value=.21; rg.gain.value=.3; rot.gain.value=.7; rl.connect(rg).connect(rot.gain); rl.start(t); rl.stop(t+dur+.1); nodes.push(rl);
    const horn=actx.createBiquadFilter(); horn.type='bandpass'; horn.frequency.value=700; horn.Q.value=.9;
    const dist=actx.createBiquadFilter(); dist.type='lowpass'; dist.frequency.value=1600;
    horn.connect(dist).connect(rot).connect(out);
    const dl=actx.createDelay(2); dl.delayTime.value=.42; const fb=actx.createGain(); fb.gain.value=.38; const fl=actx.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=900; const wet=actx.createGain(); wet.gain.value=.45;
    out.connect(actx.destination); out.connect(dl); dl.connect(fl).connect(fb).connect(dl); fl.connect(wet).connect(actx.destination); out.connect(room());
    for(const [ratio,det,type,v] of [[1,0,'sawtooth',.3],[1,7,'sawtooth',.22],[1.19,-5,'sawtooth',.2],[1.19,4,'triangle',.25],[.5,0,'sine',.25]]){
      const o=actx.createOscillator(), g=actx.createGain(); o.type=type; o.detune.value=det; g.gain.value=v;
      const c2=new Float32Array(N); for(let i=0;i<N;i++) c2[i]=curve[i]*ratio; o.frequency.setValueCurveAtTime(c2,t,dur);
      o.connect(g).connect(horn); o.start(t); o.stop(t+dur+.1); nodes.push(o) }
  }
  /* 휴대폰 알림음은 부드럽게(사인파) 깔고, 진짜 공포는 바깥 사이렌이 맡는다 */
  function siren(level){
    if(!actx||!sound) return; const t=actx.currentTime;
    for(const [st,d] of [[0,1.6],[2,.8],[3.1,.8]]) for(const f of [853,960]){ const o=actx.createOscillator(),g=actx.createGain(); o.type='sine'; o.frequency.value=f; const a=t+st;
      g.gain.setValueAtTime(0,a); g.gain.linearRampToValueAtTime(.035,a+.02); g.gain.setValueAtTime(.035,a+d-.04); g.gain.linearRampToValueAtTime(0,a+d); o.connect(g).connect(room()); o.start(a); o.stop(a+d+.05); nodes.push(o) }

function seedR(s){ let h=2166136261; for(const c of s) h=Math.imul(h^c.charCodeAt(0),16777619); return ()=>{ h=Math.imul(h^(h>>>15),2246822507); h=Math.imul(h^(h>>>13),3266489909); return ((h^=h>>>16)>>>0)/4294967296 } }

function inPoly(x,y,P){ let c=false; for(let i=0,j=P.length-1;i<P.length;j=i++){ const [xi,yi]=P[i],[xj,yj]=P[j]; if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi)) c=!c } return c }
function dSeg(x,y,L){ let m=1e9; for(let i=1;i<L.length;i++){ const [ax,ay]=L[i-1],[bx,by]=L[i], dx=bx-ax, dy=by-ay, t=clamp(((x-ax)*dx+(y-ay)*dy)/(dx*dx+dy*dy),0,1); m=Math.min(m,Math.hypot(x-ax-t*dx,y-ay-t*dy)) } return m }
const wet=(x,y)=>inPoly(x,y,LAKE)||dSeg(x,y,INLET)<2.4||CREEKS.some(c=>dSeg(x,y,c)<1.1);

  const slots=[]; for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) slots.push([c,r]); for(let i=slots.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); [slots[i],slots[j]]=[slots[j],slots[i]] }
  list.forEach(([k,n,t,d],i)=>{ let [c,r]=slots[i], x, y, tries=0;
    do { x=x0+(c+.22+R()*.56)*cw; y=y0+(r+.22+R()*.56)*ch; tries++ } while(wet(x,y)&&tries<20);
    if(wet(x,y)){ x+=D.k==='westhill'||D.k==='quabbin'?-4:5 }
    const T=ZTYPE[t], dg=clamp(D.dg+(t==='horde'||t==='nest'?1:0)+(t==='shelter'?-1:0),1,5);
    const pool=ZPOOL[Math.min(5,D.dg)].slice(), zp=[]; const PR=seedR(k); while(zp.length<3&&pool.length) zp.push(pool.splice(Math.floor(PR()*pool.length),1)[0]); if(D.dg>=2&&!zp.includes('walker')&&D.dg<4) zp.push('walker');
    const loot={}; for(const r in T.loot) loot[r]=[Math.round(T.loot[r][0]*(1+(D.dg-1)*.45)),Math.round(T.loot[r][1]*(1+(D.dg-1)*.45))];
    MAP[k]={n,x:+x.toFixed(1),y:+y.toFixed(1),d:D.k,t,lv:D.lv,dg,zp,loot,desc:d,home:t==='home'?1:0,sec:Math.round(90+dg*45+T.t*6)};

function makeCrew(origin,bias){
  const st={str:rollStat(4),agi:rollStat(4),end:rollStat(4),per:rollStat(4),cha:rollStat(4)}; if(bias&&st[bias]!=null) st[bias]=Math.min(10,st[bias]+2);
  return {id:'c'+Date.now().toString(36)+ri(100,999),name:stPick(FIRST)+' '+stPick(LAST),origin,st,hp:100,state:'idle',infT:0,t:Date.now()};
}

function humanEncounter(n){
  const who=stPick(['굶주린 대학생','무장한 약탈자','길 잃은 간호사','도망친 죄수','전직 경찰','외톨이 사냥꾼','정비공','10대 남매 중 형']);
  rt.modalLock=true;
  openModal(`<div class="eyebrow">HUMAN <span class="dash"></span> ${esc(n.n)}</div><h2>${esc(who)}</h2><p style="margin:0;line-height:1.7">폐허 사이에서 사람과 눈이 마주쳤다. 상대도 나를 재고 있다.</p>
    <div class="story-opts">
      <button class="btn opt" data-hu="force">제압해서 포획한다 <small class="optlv">힘</small></button>
      <button class="btn opt" data-hu="talk">설득해서 데려간다 <small class="optlv">매력</small></button>
      <button class="btn opt" data-hu="pay" ${(S.money||0)>=30&&(S.res.food||0)>=15?'':'disabled'}>$30과 식량 15를 주고 영입한다</button>
      <button class="btn opt" data-hu="leave">못 본 척 지나간다</button></div><button class="btn ghost sm" id="huLater" type="button">나중에 처리하기</button>`);
  S.curHu=Object.keys(MAP).find(k=>MAP[k]===n)||S.pos; markSave(); FXL.pre(/약탈자|죄수/.test(who)?'threat':'human');
  $('huLater').onclick=()=>{ S.pend=S.pend||[]; S.pend.unshift({k:'human',z:S.curHu,t:Date.now()}); S.curHu=null; rt.modalLock=false; closeModal(); toast('처리할 일에 넣어 두었다.'); markSave(); render() };
  $('mbox').querySelectorAll('[data-hu]').forEach(b=>b.onclick=()=>{ if(b.disabled) return; $('mbox').querySelectorAll('[data-hu],#huLater').forEach(x=>x.disabled=true); S.curHu=null;
    let k=b.dataset.hu; let t, c=null, fx=[]; const weak=resting()||S.hp<=0; if(weak&&k!=='leave'&&k!=='pay'){ fx.push('[체력 바닥] 실패') }
    if(k==='force'){ if(!weak&&Math.random()<.35+ST('str')*.05){ c=addCrew('포획한 '+who,'str'); t='목덜미를 잡아 바닥에 눌렀다. 그는 결국 고개를 끄덕였다.' } else { S.hp=Math.max(1,S.hp-15); fx.push('체력 -15'); t='상대가 더 빨랐다. 팔꿈치에 얼굴을 맞고, 그는 사라졌다.' } }
    else if(k==='talk'){ if(!weak&&Math.random()<.3+ST('cha')*.05){ c=addCrew('설득한 '+who,'cha'); t='"…좋아. 혼자보다는 낫겠지."' } else { const m=Math.min(S.money||0,ri(5,20)); S.money-=m; if(m) fx.push(`$-${m}`); t='말이 길어지는 사이 그는 내 주머니를 털고 달아났다.' } }
    else if(k==='pay'){ S.money-=30; S.res.food-=15; c=addCrew('영입한 '+who); fx.push('$-30','식량 -15'); t='그는 먹을 것부터 받아 들고, 고맙다는 말 대신 짐을 들었다.' }
    else { t='서로 천천히 뒷걸음질 쳤다. 오늘은 아무도 다치지 않는다.'; if(/학생|간호사|남매/.test(who)){ t='뒤에서 "저기요…" 하는 목소리가 들렸다. 돌아보지 않았다.'; ignoreSfx() } }
    if(c&&k==='force'&&Math.random()<.4) seed('captiveKin',{n:c.name},20,50);
    if(c) fx.push(`대원 합류: ${c.name} (${Object.entries(c.st).map(([a,v])=>STN[a]+' '+v).join(' · ')})`);
    $('mbox').innerHTML=`<div class="eyebrow">HUMAN</div><h2>${esc(who)}</h2><p style="margin:0;line-height:1.7">${esc(t)}</p>${fx.length?`<ul class="ev-eff">${fx.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<button class="btn pri" id="huOk">계속</button>`;
    $('huOk').onclick=()=>{ rt.modalLock=false; closeModal(); addXp(c?20:6); markSave(); render() };
  });
}

function missionTime(node,n){ return Math.round((petOn('hawk')?.85:1)*(1-buffV('crew'))*(travelSec('garage',node)*2+60+MAP[node].dg*50)*(n>1?1.1:1)) }
ACT.crewSel=el=>{ rt.cSel=rt.cSel||{}; const id=el.dataset.id; rt.cSel[id]=!rt.cSel[id]; render() };
ACT.crewNode=el=>{ rt.cNode=el.value; render() };
ACT.sendMission=()=>{
  const ids=Object.keys(rt.cSel||{}).filter(id=>rt.cSel[id]&&crewById(id)?.state==='idle'); const node=rt.cNode||'gas';
  if(!ids.length) return toast('보낼 대원을 고르세요.'); if(ids.length>3) return toast('한 번에 최대 3명까지 보낼 수 있습니다.');
  if(lvlOf(S.xp)<MAP[node].lv) return toast('아직 그쪽으로는 보낼 수 없다.');
  const sec=missionTime(node,ids.length)*(S.inv.drone>0?.5:1); if(S.inv.drone>0) S.inv.drone--;
  ids.forEach(id=>crewById(id).state='away'); S.missions=S.missions||[]; sfx('radio');
  S.missions.push({id:'m'+Date.now().toString(36),crew:ids,node,s:Date.now(),e:Date.now()+sec*1000});
  rt.cSel={}; toast(`${MAP[node].n}(으)로 ${ids.length}명 파견 · ${mmss(sec*1000)}`); markSave(); schedulePub(2000); render();
};
function resolveMission(m){
  const node=MAP[m.node], team=m.crew.map(crewById).filter(Boolean), lines=[];
  if(!team.length) return [{k:'none',t:'파견대가 사라졌다. 누군가 데려간 것 같다.'}];
  const tp=team.reduce((a,c)=>a+power(c),0), avg=k=>team.reduce((a,c)=>a+c.st[k],0)/team.length;
  const n=1+Math.floor(node.dg/2)+(Math.random()<.5?1:0);
  for(let i=0;i<n;i++){
    const w=MEV.map(e=>{ const k=e[0]; return k==='death'?.15*node.dg*(1-avg('agi')*.06):k==='infect'?.35*node.dg*(1-avg('agi')*.05):k==='injury'?.5*node.dg:k==='capture'||k==='subdue'?.6*(1+avg('str')*.05):k==='recruit'?.5*(1+avg('cha')*.06):k==='loot'?1.3*(1+avg('per')*.04):k==='raid'?.6:k==='pet'?.18:k==='col'?.4:k==='none'?.3:1 });
    let x=Math.random()*w.reduce((a,b)=>a+b,0), j=0; for(;j<MEV.length-1;j++){ x-=w[j]; if(x<0) break }
    const [k,txt,arg,arg2]=MEV[j], c=stPick(team.filter(t=>t.state!=='dead')), name=c?c.name:'대원', t=txt.replace('{a}',name), r={k,t,fx:[]};
    if(!c) break;
    if(k==='loot'||k==='raid'){ if(k==='raid'&&Math.random()>Math.min(.85,.3+tp*.02)){ const dmg=ri(15,35); c.hp=Math.max(5,c.hp-dmg); r.t+=' 하지만 반격에 밀려 퇴각했다.'; r.fx.push(`${c.name} 체력 -${dmg}`); r.bad=1 }
      else { for(const rk in arg){ const q=Math.round(ri(arg[rk][0],arg[rk][1])*(1+avg('per')*.04)*(1+node.dg*.1)); gain(rk,q); r.fx.push(`${RES[rk].n} +${q}`) } if(arg2){ const m2=ri(arg2[0],arg2[1]); addMoney(m2); r.fx.push(`$${m2}`) } } }
    else if(k==='cash'){ const m2=Math.round(ri(arg[0],arg[1])*(1+node.dg*.15)); addMoney(m2); r.fx.push(`$${m2}`) }
    else if(k==='item'){ const it=stPick(arg); S.inv[it]=(S.inv[it]||0)+1; r.fx.push(ITEMS[it].n) }
    else if(k==='capture'||k==='subdue'||k==='recruit'){ const ok=k==='recruit'?Math.random()<.4+avg('cha')*.05:Math.random()<.35+avg('str')*.05;
      if(ok){ const nc=addCrew(k==='capture'?'포획':k==='subdue'?'굴복시킨 자':'구조한 생존자',arg); if(nc) r.fx.push(`새 대원: ${nc.name} (${Object.entries(nc.st).map(([a,v])=>STN[a]+' '+v).join(' · ')})`); else r.fx.push('자리가 없어 돌려보냈다') }
      else { r.t+=' 하지만 상대가 도망쳤다.'; r.bad=1 } }
    else if(k==='injury'){ const dmg=ri(arg[0],arg[1]); c.hp=Math.max(5,c.hp-dmg); r.fx.push(`${c.name} 체력 -${dmg}`); r.bad=1 }
    else if(k==='infect'){ if(Math.random()<c.st.end*.05){ r.t+=' 다행히 이빨이 옷을 뚫지 못했다.' } else { c.state='infected'; c.infT=Date.now()+10*60000; r.fx.push(`${c.name} 감염! 10분 안에 약품 3으로 치료하지 않으면 변이`); r.bad=2 } }
    else if(k==='death'){ if(Math.random()<c.st.agi*.06){ r.t=r.t.replace('돌아오지 못했다.','').replace('무전이 끊겼다.','')+' …간신히 살아 돌아왔다.'; c.hp=Math.max(5,c.hp-40); r.fx.push(`${c.name} 체력 -40`); r.bad=1 } else { c.state='dead'; c.diedAt=Date.now(); r.fx.push(`${c.name} 사망`); r.bad=3; feed(`${S.nick}님의 대원 ${c.name}이(가) 돌아오지 못했습니다`) } }
    else if(k==='col'){ giveCol(rollCol(arg),'파견'); r.fx.push('수집품') }
    else if(k==='pet'){ const pk=gainPet(); r.fx.push(pk?`펫: ${PETS[pk].n}`:'이미 있는 동물이라 놓아주었다') }
    else if(k==='ing'){ const q=ri(2,4); S.ing=S.ing||{}; S.ing[arg]=(S.ing[arg]||0)+q; r.fx.push(`${ING[arg].n} +${q}`) }
    else if(k==='zfight'){ const zp=stPick(node.zp), z=ZOMBIES[zp], win=Math.random()<Math.min(.92,.4+tp*.02-z.lv*.03);
      if(win){ const m2=ri(5,15)*arg; addMoney(m2); gain('scrap',ri(4,10)); r.fx.push(`${z.n} 격퇴`,`$${m2}`); S.kills++ } else { const dmg=ri(15,30)*arg; team.forEach(t=>t.hp=Math.max(5,t.hp-Math.round(dmg/team.length))); r.fx.push(`${z.n}에게 밀림 · 일행 체력 -${dmg}`); r.bad=1 } }
    lines.push(r); S.mevSeen=S.mevSeen||{}; S.mevSeen[j]=1;
  }
  team.forEach(t=>{ if(t.state==='away') t.state='idle' });
  addXp(10+node.dg*8);
  return lines;
}
ACT.collectMission=el=>{
  const i=(S.missions||[]).findIndex(m=>m.id===el.dataset.id); if(i<0) return; const m=S.missions[i]; if(Date.now()<m.e) return;
  S.missions.splice(i,1); const lines=resolveMission(m); markSave(); schedulePub(2000);
  rt.modalLock=true;
  openModal(`<div class="eyebrow">FIELD REPORT <span class="dash"></span> ${esc(MAP[m.node].n)}</div><h2>파견 보고</h2><div class="radio-rx" id="rx"><span class="rxbar"></span>무전 수신 중…</div><div class="report" id="rep"></div><button class="btn pri" id="repOk" hidden>확인</button>`);
  let k=0; const rep=$('rep');
  const step=()=>{ if(!rep.isConnected) return; if(k>=lines.length){ $('rx').hidden=true; $('repOk').hidden=false; $('repOk').focus({preventScroll:true}); return }
    const r=lines[k++], d=document.createElement('div'); d.className='rline b'+(r.bad||0); d.innerHTML=`<span class="ric">${r.bad>=3?'✕':r.bad===2?'☣':r.bad?'!':'+'}</span><div><p></p>${r.fx.length?`<small>${r.fx.map(esc).join(' · ')}</small>`:''}</div>`; d.querySelector('p').textContent=r.t; rep.append(d); sfx(r.bad>=3?'sting':r.bad?'hurt':'tick');
    setTimeout(step,900) };
  setTimeout(step,900);
  $('repOk').onclick=()=>{ rt.modalLock=false; closeModal(); render() };
};
ACT.healCrew=el=>{ const c=crewById(el.dataset.id); if(!c) return;
  if(c.state==='infected'){ if((S.inv.antibio||0)>0) S.inv.antibio--; else { if((S.res.med||0)<3) return toast('약품 3 또는 항생제가 필요합니다.'); S.res.med-=3 } c.state='idle'; c.infT=0; c.hp=Math.max(c.hp,40); toast(`${c.name}의 감염을 막았습니다.`) }
  else { if((S.inv.bandage||0)<1) return toast('붕대가 필요합니다.'); S.inv.bandage--; c.hp=Math.min(100,c.hp+40); toast(`${c.name} 체력 +40`) }
  markSave(); render() };
ACT.dismissCrew=el=>{ const c=crewById(el.dataset.id); if(!c||c.state==='away') return; S.crew=S.crew.filter(x=>x!==c); toast(`${c.name}을(를) 떠나보냈습니다.`); markSave(); schedulePub(2000); render() };
function crewTick(){ const now=Date.now(); let ch=false;
  for(const c of S.crew||[]){ if(c.state==='infected'&&c.infT&&now>=c.infT){ c.state='dead'; c.diedAt=now; ch=true; toast(`${c.name}이(가) 변이했다. 손쓸 수 없었다.`,true); feed(`${S.nick}님의 대원 ${c.name}이(가) 감염자로 변했습니다`) }
    if(c.tmp&&now>c.tmp&&c.state!=='away'){ c.state='gone'; S.crew=S.crew.filter(x=>x!==c); ch=true; toast(`${c.name}이(가) 원래 무리로 돌아갔다.`) }
    if(c.state==='idle'&&c.hp<100) c.hp=Math.min(100,c.hp+.02) }
  if(ch){ markSave(); if(!inputFocused()&&$('modal').hidden) render() } }

function pubCrew(){ return (S.crew||[]).filter(c=>c.state==='away').slice(0,6).map(c=>{ const m=(S.missions||[]).find(x=>x.crew.includes(c.id)); return {id:c.id,name:c.name,st:c.st,node:m?m.node:'',e:m?m.e:0} }) }
ACT.raidCrew=async el=>{
  const tid=el.dataset.id, mid=el.dataset.m, p=rt.players.get(tid); const target=(p&&Array.isArray(p.crewAway)?p.crewAway:[]).find(x=>x.id===mid);
  if(!target) return toast('그 대원은 이미 돌아갔습니다.'); if(!rt.online.has(tid)) return toast('접속 중인 생존자의 파견대만 노릴 수 있습니다.');
  if(Date.now()-(S.raidT||0)<10*60000) return toast(`다음 습격까지 ${mmss(10*60000-(Date.now()-(S.raidT||0)))}`);
  const mine=crewAlive().filter(c=>c.state==='idle').sort((a,b)=>power(b)-power(a))[0]; if(!mine) return toast('보낼 수 있는 대원이 없습니다.');
  S.raidT=Date.now(); const ts=target.st||{}, tp=(ts.str||4)*1.2+(ts.end||4)*.8+(ts.agi||4)*.6;
  const win=Math.random()<clamp(.5+(power(mine)-tp)*.05,.15,.85);
  if(win){ const c=addCrew(`${nameOf(tid)}에게서 빼앗은 대원`,null,{id:'c'+Date.now().toString(36)+ri(100,999),name:String(target.name).slice(0,20),origin:'',st:{str:clamp(ts.str|0,1,10),agi:clamp(ts.agi|0,1,10),end:clamp(ts.end|0,1,10),per:clamp(ts.per|0,1,10),cha:clamp(ts.cha|0,1,10)},hp:70,state:'idle',infT:0,t:Date.now()});
    if(c){ c.origin=`${nameOf(tid)}에게서 빼앗음`; S.raidsOut=(S.raidsOut||[]).concat({id:'r'+Date.now().toString(36),target:tid,member:mid,t:Date.now()}).slice(-10);
      if(rt.db&&rt.myId){ try{ await rt.db.doc('raids/'+rt.myId).set({list:S.raidsOut}) }catch(e){} }
      feed(`${S.nick}님이 ${nameOf(tid)}님의 파견대에서 ${c.name}을(를) 빼앗았습니다`); toast(`습격 성공! ${c.name}이(가) 우리 편이 됐다.`,true); addXp(30) } }
  else { mine.hp=Math.max(5,mine.hp-30); toast(`습격 실패. ${mine.name} 체력 -30`); feed(`${S.nick}님이 ${nameOf(tid)}님의 파견대를 노렸다가 실패했습니다`) }
  markSave(); render();
};
function watchRaids(){
  if(!rt.db||rt.raidUnsub) return;
  rt.raidUnsub=rt.db.collection('raids').limit(200).onSnapshot(snap=>{
    let lost=[]; S.raidSeen=S.raidSeen||[];
    for(const d of snap.docs){ if(d.id===rt.myId) continue; const list=(d.data()||{}).list; if(!Array.isArray(list)) continue;
      for(const r of list){ if(!r||r.target!==rt.myId||S.raidSeen.includes(r.id)) continue; S.raidSeen.push(r.id);
        const c=crewById(r.member); if(c&&c.state==='away'){ S.crew=S.crew.filter(x=>x!==c); for(const m of S.missions||[]) m.crew=m.crew.filter(x=>x!==c.id); lost.push([c.name,nameOf(d.id)]) } } }
    S.raidSeen=S.raidSeen.slice(-100);
    if(lost.length){ lost.forEach(([n,by])=>toast(`${by}님에게 파견 중이던 ${n}을(를) 빼앗겼다!`,true)); markSave(); if(!inputFocused()&&$('modal').hidden) render() }
  },()=>{});
}

function crewCard(c,sel){
  const away=c.state==='away', inf=c.state==='infected', dead=c.state==='dead';
  return `<div class="card crew${dead?' wlock':''}${inf?' infected':''}"><div class="row spread"><h3>${esc(c.name)}</h3><span class="tag">${dead?'사망':inf?'감염':away?'파견 중':'대기'}</span></div>
    <p class="muted" style="font-size:12px">${esc(c.origin||'')}</p>
    <div class="cst">${Object.entries(c.st).map(([k,v])=>`<div><span>${STN[k]}</span><i style="width:${v*10}%"></i><b class="num">${v}</b></div>`).join('')}</div>
    <div class="bar red"><i style="width:${c.hp}%"></i></div><span class="note num">체력 ${Math.round(c.hp)} · 전투력 ${Math.round(power(c))}${inf?` · 변이까지 ${mmss(c.infT-Date.now())}`:''}</span>
    ${dead?'':`<div class="row">${!away?`<button class="btn sm${sel?' pri':''}" data-act="crewSel" data-id="${c.id}" ${inf?'disabled':''}>${sel?'선택됨':'파견 선택'}</button>`:''}${inf?`<button class="btn sm pri" data-act="healCrew" data-id="${c.id}">${(S.inv.antibio||0)>0?'항생제로 치료':'약품 3으로 치료'}</button>`:(!away&&c.hp<100?`<button class="btn sm" data-act="healCrew" data-id="${c.id}" ${(S.inv.bandage||0)>0?'':'disabled'}>붕대</button>`:'')}${!away?`<button class="btn sm ghost" data-act="dismissCrew" data-id="${c.id}">보내기</button>`:''}</div>`}</div>`;
}

}

const PETS={
  dog:{n:'떠돌이 개',d:'감염자 조우 확률 -15%',how:'덫에 걸린 개 사건, 파견'},
  cat:{n:'얼룩 고양이',d:'돌발 사건 확률 +10%',how:'파견 중 발견'},
  crow:{n:'까마귀',d:'희귀품 발견 +3%p',how:'파견 중 발견'},
  ferret:{n:'족제비',d:'탐색·식량 구하기 획득량 +8%',how:'파견 중 발견'},
  goat:{n:'염소',d:'배고픔 감소 속도 -20%',how:'파견 중 발견'},
  hawk:{n:'매',d:'파견 시간 -15%',how:'파견 중 발견'},
};

function onLevel(l){
  S.statPts=(S.statPts||0)+3; clearTimeout(rt.lvT); rt.lvT=setTimeout(()=>toast(`스탯 포인트 ${S.statPts}개 · 내 캐릭터에서 배분하세요`,true),900);
  const nd=DIST.find(D=>D.lv===l); if(nd) setTimeout(()=>{ toast(`새 구역이 열렸다: ${nd.n}`,true); feed(`${S.nick}님이 ${nd.n}에 들어갈 수 있게 되었습니다`) },1300);
  const u=UNLOCKS.find(x=>x[0]===l);
  if(l>=CAMP_LV&&!S.camp){ unlockCamp(); return }
  if(u) setTimeout(()=>toast(`Lv.${l} · ${u[1]}`,true),400);
}
function unlockCamp(){
  S.camp=true; const r=routeOf(S.route), cs=S.campStart||{workers:4};
  S.workers=(S.campStart?(cs.workers||4):Math.max(S.workers||0,4))+(S.recruits||0); S.recruits=0; const base={scrap:1,wood:1,food:1,water:1,guard:0};
  S.jobs=Object.assign(base,cs.jobs||{}); let sum=Object.values(S.jobs).reduce((a,b)=>a+b,0);
  while(sum>S.workers){for(const k of ['water','food','wood','scrap']) if(S.jobs[k]>0&&sum>S.workers){S.jobs[k]--;sum--}}
  if(cs.bld) for(const k in cs.bld) S.bld[k]=Math.max(S.bld[k],cs.bld[k]);
  S.pos='garage'; S.travel=null; S.weapons.pistol=1; S.inv.ammo=(S.inv.ammo||0)+1; S.inv.pick=(S.inv.pick||0)+1;
  feed(`${S.nick}님이 주차 빌딩 캠프에 합류했습니다 (일꾼 ${S.workers}명)`);
  markSave(); flushPub(); rt.enc=null; render();
  const lines=r?r.arrive.map(bud):['손전등 신호를 따라간 끝에, 주차 빌딩에 닿았다.'];
  setTimeout(()=>whenFree(()=>{
    openModal(`<div class="eyebrow">LV.5 <span class="dash"></span> PARKING GARAGE</div><h2>주차 빌딩</h2>
      ${lines.map(x=>`<p style="margin:0;line-height:1.7">${esc(x)}</p>`).join('')}
      <p style="margin:0;line-height:1.7">생존자 ${S.workers}명이 손전등을 흔들었다. 오는 길에 버려진 순찰차 트렁크에서 권총도 하나 챙겼다.</p>
      <ul class="ev-eff"><li>작업 배치 · 시설 관리 · 탐험 지도 열림</li><li>9mm 권총 획득 · 검문소 선별 · 차량 직결 열림</li><li>이제 접속하지 않아도 일꾼들이 자원을 모읍니다</li></ul>
      <button class="btn pri" data-act="closeModal">캠프 둘러보기</button>`,()=>setTab('work'));
  }),500);
}

  };

  /* 배경음: 낮은 드론 + 느린 단조 패드 + 먼 금속음 + 바람 */
  function bgmStart(){ if(bgmOn||!ctx()) return; bgmOn=true; const t=ac.currentTime;
    const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=520; lp.connect(bgmG);
    [55,55.4,82.4].forEach((f,i)=>{ const o=ac.createOscillator(), g=ac.createGain(); o.type=i<2?'sawtooth':'triangle'; o.frequency.value=f; g.gain.value=i<2?.05:.04; o.connect(g); g.connect(lp); o.start(t) });
    const lfo=ac.createOscillator(), lg=ac.createGain(); lfo.frequency.value=.05; lg.gain.value=180; lfo.connect(lg); lg.connect(lp.frequency); lfo.start(t);
    const wb=ac.createBuffer(1,ac.sampleRate*4,ac.sampleRate), wd=wb.getChannelData(0); let last=0; for(let i=0;i<wd.length;i++){ last=(last+.02*(Math.random()*2-1))/1.02; wd[i]=last*3 } const ws=ac.createBufferSource(); ws.buffer=wb; ws.loop=true; const wg=ac.createGain(); wg.gain.value=.12; ws.connect(wg); wg.connect(bgmG); ws.start(t);
    const chords=[[220,261.6,329.6],[196,246.9,293.7],[174.6,220,261.6],[164.8,207.7,246.9]]; let ci=0;
    const pad=()=>{ if(!bgmOn) return; const now=ac.currentTime; chords[ci++%4].forEach(f=>{ const o=ac.createOscillator(), g=ac.createGain(), fl=ac.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=900; o.type='triangle'; o.frequency.value=f; g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(.022,now+2.5); g.gain.linearRampToValueAtTime(0,now+9); o.connect(fl); fl.connect(g); g.connect(bgmG); o.start(now); o.stop(now+9.2) });
      if(Math.random()<.5) tone(bgmG,[880,1046,1318][ri(0,2)],now+ri(2,6),2.5,'sine',.015); timers.push(setTimeout(pad,8000)) };
    pad();
    battle=ac.createGain(); battle.gain.value=0; battle.connect(bgmG);
    const beat=()=>{ if(!bgmOn) return; const now=ac.currentTime; if(battle.gain.value>.01){ tone(battle,62,now,.25,'sine',.5,40); tone(battle,62,now+.3,.2,'sine',.35,40) } timers.push(setTimeout(beat,900)) }; beat();

/* ================= 이벤트 연출: 효과음 · 긴장 배경음 · 화면 퍼포먼스 ================= */
const FXL=(()=>{
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let layer=null, tens=0, tensT=null;
  const on=()=>SND.set.horror!==false;
  function L(){ if(layer&&layer.isConnected) return layer; layer=document.createElement('div'); layer.id='fxl'; layer.setAttribute('aria-hidden','true'); layer.innerHTML='<div class="fx-flash"></div><div class="fx-vig"></div><canvas class="fx-static"></canvas><div class="fx-black"><p class="fx-txt"></p></div>'; document.body.append(layer); return layer }
  function flash(col,ms){ if(!on()||reduce) return; const f=L().querySelector('.fx-flash'); f.style.background=col||'#fff'; f.style.transition='none'; f.style.opacity=.22; void f.offsetWidth; f.style.transition=`opacity ${ms||380}ms ease-out`; f.style.opacity=0 }
  function vig(level,col){ const v=L().querySelector('.fx-vig'); v.style.setProperty('--vc',col||'rgba(140,10,10,.9)'); v.style.opacity=on()?level:0 }
  function shake(power,ms){ if(!on()||reduce) return; const el=document.querySelector('.shell')||document.body, box=$('mbox'); [el,box].forEach(x=>{ if(!x) return; x.style.setProperty('--shk',(power||6)+'px'); x.classList.remove('fx-shake'); void x.offsetWidth; x.classList.add('fx-shake'); setTimeout(()=>x.classList.remove('fx-shake'),ms||450) }) }
  function staticOn(ms){ if(!on()) return; const c=L().querySelector('.fx-static'), g=c.getContext('2d'); c.width=160; c.height=100; c.style.opacity=.16; const end=Date.now()+(ms||500);
    const draw=()=>{ const im=g.createImageData(160,100); for(let i=0;i<im.data.length;i+=4){ const v=Math.random()*255; im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=255 } g.putImageData(im,0,0); if(Date.now()<end) requestAnimationFrame(draw); else c.style.opacity=0 }; draw(); sfx('static') }
  function blackout(ms,txt,after){ const b=L().querySelector('.fx-black'), t=b.querySelector('.fx-txt'); t.textContent=txt||''; b.classList.add('on'); sfx('down');
    setTimeout(()=>{ if(on()) staticOn(260) },Math.max(0,(ms||1600)-300)); setTimeout(()=>{ b.classList.remove('on'); t.classList.remove('glitch'); after&&after() },ms||1600) }
  function tension(v,ms){ tens=v; SND.tension(v); vig(v*.32); clearTimeout(tensT); if(ms) tensT=setTimeout(()=>tension(0),ms) }
  function flicker(){ if(!on()||reduce) return; const el=document.querySelector('.shell'); if(!el) return; el.classList.remove('fx-flick'); void el.offsetWidth; el.classList.add('fx-flick'); setTimeout(()=>el.classList.remove('fx-flick'),900) }
  /* 이벤트 분위기 */
  const MOOD=[['horror',/감염|물렸|물어|이빨|좀비|놈들|비명|변이|시체|피가|피를|검게|신음|썩은/],['gun',/총|탄|쏜|저격|사격|탕!/],['gas',/가스|산성|연기|방독|누렇/],['threat',/무리|약탈|불량배|통행료|위협|쇠파이프|협상|총구|배신|함정/],['human',/생존자|도움|구조|아이|간호사|학생|엄마|친구|단톡/],['mystery',/무전|신호|안개|소리|방송|수상한/]];
  function moodOf(t){ for(const [m,re] of MOOD) if(re.test(t)) return m; return 'tense' }
  function pre(m){ if(m==='horror'){ sfx('sting'); flicker(); tension(.85); setTimeout(()=>sfx('heart'),500) }
    else if(m==='gun'){ sfx('gunshot'); flash('#fff8e0',260); shake(9,380); tension(.6) }
    else if(m==='gas'){ sfx('hiss'); flash('rgba(160,180,60,.5)',700); vig(.5,'rgba(90,110,20,.85)'); tension(.5) }
    else if(m==='threat'){ sfx('bang'); shake(5,300); tension(.55) }
    else if(m==='human'){ sfx('radio'); tension(.2) }
    else if(m==='mystery'){ staticOn(450); tension(.4) }
    else { sfx('alert'); tension(.35) } }
  /* 결과 연출: 결과 객체 o를 보고 */
  function post(o,m){ const bad=(o.hp||0)<0||o.enc||o.down||o.pct||o.items0||o.hpTo;
    if(o.enc){ sfx('scream'); flash('rgba(200,0,0,.6)',500); shake(12,600); tension(1,6000) }
    else if((o.hp||0)<=-15||o.hpTo){ sfx('hurt'); flash('rgba(200,0,0,.55)',450); shake(8,450); sfx('heart'); tension(.7,4000) }
    else if((o.hp||0)<0){ sfx('hurt'); flash('rgba(200,0,0,.35)',350); shake(4,300); tension(.4,2500) }
    else if(o.pct||o.items0){ sfx('bang'); shake(6,400); tension(.4,2500) }
    else if(!bad){ sfx('win'); tension(0) }
    if(o.down) setTimeout(()=>blackout(2400,'…정신을 잃었다'),300) }
  /* 강제 이동: 정신을 차려 보니 다른 곳 */
  function relocate(why){ if(S.travel||S.scan||rt.party) return false; const cur=MAP[S.pos], here=zoneD(S.pos), lv=lvlOf(S.xp);
    const cand=Object.keys(MAP).filter(k=>k!==S.pos&&!MAP[k].home&&lv>=zoneD(k).lv&&Math.hypot(MAP[k].x-cur.x,MAP[k].y-cur.y)<26); if(!cand.length) return false; const to=stPick(cand);
    blackout(2600,why||'…', ()=>{ S.pos=to; S.visited=S.visited||{}; S.visited[to]=1; markSave(); render(); toast(`정신을 차려 보니 ${MAP[to].n}였다.`,true); slog(`정신을 차려 보니 ${MAP[to].n}였다.`) }); return true }
  /* 평소의 공포 앰비언스 */
  function ambient(){ if(!on()||!S.intro||!$('modal').hidden||rt.enc||document.hidden) return; if(Math.random()<.35){ const r=Math.random(); if(r<.4){ sfx('distant') } else if(r<.7){ sfx('whisper'); flicker() } else { sfx('knock') } } }
  setInterval(ambient,180000);
  return {flash,vig,shake,staticOn,blackout,tension,flicker,moodOf,pre,post,relocate,level:()=>tens};
})();

const DROP_N=3;
function dropReward(){
  const dm=curEv().def.drop2?2:1, o={}, out=[]; const luck=statBonus.rare();
  const m=Math.round(ri(15,45)*dm); addMoney(m); out.push(`$${m}`);
  const roll=Math.random();
  if(roll<.3+luck){ const sp=stPick(['ration','adrenaline','gasmask','parts','tonic','medkit','molotov','ammo','bandage','pick']); S.inv[sp]=(S.inv[sp]||0)+1; out.push(`특수품 「${ITEMS[sp].n}」`) }
  else if(roll<.65){ const m2=Math.round(ri(40,110)*dm); addMoney(m2); out.push(`현금 뭉치 $${m2}`) }
  else { o.elec=ri(1,3)*dm; o.fuel=ri(1,2)*dm; o.med=ri(1,2)*dm; for(const k in o) gain(k,o[k]); out.push(lootText(o)) }
  if(Math.random()<.25) { giveCol(rollCol([.2,.4,.3,.1]),'보급 상자') }
  addXp(10); toast('보급 상자: '+out.join(', '),true); markSave(); render();
}
async function claimDrop(i){
  i=+i||0; const pid=dropId();
  S.dropLocal=typeof S.dropLocal==='object'&&S.dropLocal?S.dropLocal:{};
  if(!rt.db||!rt.myId){ const key=pid+'-'+i; if(Object.keys(S.dropLocal).some(k=>k.startsWith(pid+'-'))) return toast('이번 보급에서는 한 상자만 열 수 있습니다.'); S.dropLocal={[key]:1,...Object.fromEntries(Object.entries(S.dropLocal).filter(([k])=>k.startsWith(pid+'-')))}; dropReward(); return }
  if(Object.values(rt.drops||{}).some(d=>d&&d.period===pid&&d.by===rt.myId)) return toast('이번 보급에서는 한 상자만 열 수 있습니다.');
  const ref=rt.db.doc('drops/s'+(pid%48)+'-'+i);
  try{
    const r=await ref.acquire({holder:rt.myId,ttlMs:5000}); if(!r.acquired) return toast('다른 생존자가 이 상자를 여는 중입니다.');
    const snap=await ref.get(); const d=snap.exists?snap.data():null;
    if(d&&d.period===pid&&d.by) return toast(d.by===rt.myId?'이미 연 상자입니다.':'한발 늦었다. 이미 누군가 가져갔다.');
    await ref.set({period:pid,by:rt.myId,at:Date.now()}); dropReward(); feed(`${S.nick}님이 보급 상자를 열었습니다`);
  }catch(e){ toast(e&&e.code==='invalid_argument'?'보기 전용 권한이라 상자를 열 수 없습니다.':'보급 상자를 열지 못했습니다. 잠시 후 다시 시도해 주세요.') }
}
function watchDrop(){
  if(!rt.db) return; const slot=dropId()%48; if(slot===rt.dropSlot) return;
  rt.dropSlot=slot; (rt.dropUnsubs||[]).forEach(u=>u()); rt.drops={};
  rt.dropUnsubs=[...Array(DROP_N).keys()].map(i=>rt.db.doc('drops/s'+slot+'-'+i).onSnapshot(s=>{rt.drops[i]=s.exists?s.data():null; renderAside()},()=>{}));
}

function posFx(o,fx){

  if(o.drone){ S.inv.drone=(S.inv.drone||0)+o.drone; fx.push('정찰 정보: 다음 탐험 시간 절반') }
  if(o.risk){ S.risk=Math.max(0,(S.risk||0)+o.risk); fx.push(o.risk>0?'배신 위험 +1':'배신 위험 초기화') }
  if(o.loyal&&!S.loyal){ S.loyal=true; fx.push('부하 충성: 배신 확률 절반') }
  if(o.ally&&!S.ally){ S.ally=true; fx.push('동맹: 이후 약탈 손실 절반') }
  if(o.items0){ for(const k of ['bandage','pick','medkit','molotov','ammo']) S.inv[k]=0; fx.push('소모품 전부 압수') }
  if(o.reset){ S.scavT=0; S.forT=0; fx.push('행동 대기시간 초기화') }

}

  const opts=Object.keys(RES).map(k=>`<option value="r:${k}">${RES[k].n} (보유 ${fmt(S.res[k])})</option>`).join('')+dups.map(k=>`<option value="c:${k}">수집품 「${COL[k].n}」 (중복 ${S.col[k]-1})</option>`).join('');
  openModal(`<h2>${esc(nameOf(to))}님에게 선물</h2><p class="note" style="margin:0">보낸 물건은 상대가 받기를 누르면 들어갑니다. 수집품은 중복된 것만 보낼 수 있습니다.</p>
    <form id="gForm" style="display:flex;flex-direction:column;gap:10px"><select id="gWhat" aria-label="보낼 것">${opts}</select>
    <div class="row"><label for="gQty" class="note">수량</label><input id="gQty" type="number" min="1" max="500" value="10" style="width:100px"></div>
    <div class="row"><button class="btn pri" type="submit">보내기</button><button class="btn" type="button" data-act="closeModal">취소</button></div></form>`);
  const sync=()=>{$('gQty').disabled=$('gWhat').value.startsWith('c:')}; $('gWhat').onchange=sync; sync();
  $('gForm').onsubmit=e=>{e.preventDefault(); const [t,k]=$('gWhat').value.split(':'); const id='g'+Date.now().toString(36)+ri(100,999);
    if(t==='c'){ if(!(S.col[k]>1)) return; S.col[k]--; S.gifts.push({id,to,c:k,t:Date.now()}) }
    else { const q=clamp(Math.floor(+$('gQty').value||0),1,500); if((S.res[k]||0)<q) return toast('보유량이 부족합니다.'); S.res[k]-=q; S.gifts.push({id,to,r:k,q,t:Date.now()}) }
    S.gifts=S.gifts.slice(-15); addXp(2); toast(`${nameOf(to)}님에게 선물을 보냈습니다.`); markSave(); flushPub(); closeModal(); render()};
}

/* ================= 금고 따기 ================= */
function openLock(){
  S.inv.pick--; markSave(); render();
  openModal(`<h2>금고 따기</h2><canvas class="lockcv" id="lockCv" width="480" height="480" aria-label="금고 다이얼"></canvas>
    <div class="row spread"><span class="note" id="lockMsg">밝은 구간에 바늘이 들어오면 누르세요 (클릭 또는 스페이스)</span><span class="num" id="lockStage">1/3</span></div>
    <button class="btn" data-act="closeModal" id="lockClose">그만두기</button>`,()=>{lock.on=false;render()});
  const cv=$('lockCv'), c=cv.getContext('2d');
  const lock={on:true,stage:0,a:0,dir:1,speed:2.4,t0:rand(0,Math.PI*2),w:.7,done:false};
  const newTarget=()=>{lock.t0=rand(0,Math.PI*2); lock.w=.7-lock.stage*.17; lock.speed=2.4+lock.stage*1.1; lock.dir*=-1};
  newTarget();
  const press=()=>{
    if(!lock.on||lock.done) return;
    let d=Math.atan2(Math.sin(lock.a-lock.t0),Math.cos(lock.a-lock.t0));
    if(Math.abs(d)<=lock.w/2){lock.stage++; $('lockStage').textContent=Math.min(3,lock.stage+1)+'/3';
      if(lock.stage>=3){lock.done=true; const o={scrap:ri(20,45),elec:ri(1,3),fuel:ri(0,2),med:ri(0,2)}; for(const k in o) gain(k,o[k]); addXp(8);
        $('lockMsg').textContent='철컥. 금고가 열렸다: '+lootText(o); toast('금고: '+lootText(o)); if(Math.random()<.4) giveCol(rollCol([.3,.4,.25,.05]),'금고'); $('lockClose').textContent='닫기'; markSave()}
      else {newTarget(); $('lockMsg').textContent='좋아. 다음 핀.'}}
    else {lock.done=true; $('lockMsg').textContent='따개가 부러졌다.'; $('lockClose').textContent='닫기'}
  };
  cv.addEventListener('pointerdown',press);
  const kd=e=>{if(e.code==='Space'&&lock.on){e.preventDefault();press()}}; addEventListener('keydown',kd);
  let last=performance.now();
  const draw=now=>{ if(!lock.on){removeEventListener('keydown',kd);return}
    const dt=(now-last)/1000; last=now; if(!lock.done) lock.a+=lock.dir*lock.speed*dt;
    c.clearRect(0,0,480,480); c.save(); c.translate(240,240);
    c.fillStyle='#1d1f22'; c.beginPath(); c.arc(0,0,200,0,7); c.fill();
    c.strokeStyle='#3a3c40'; c.lineWidth=2; for(let i=0;i<40;i++){const a=i/40*Math.PI*2; c.beginPath(); c.moveTo(Math.cos(a)*170,Math.sin(a)*170); c.lineTo(Math.cos(a)*(i%5?185:192),Math.sin(a)*(i%5?185:192)); c.stroke()}
    if(!lock.done||lock.stage>=3){c.strokeStyle=lock.stage>=3?'#86b06f':'#f2a83b'; c.lineWidth=22; c.beginPath(); c.arc(0,0,150,lock.t0-lock.w/2,lock.t0+lock.w/2); c.stroke()}
    c.strokeStyle=lock.done&&lock.stage<3?'#c8392f':'#ebe5d8'; c.lineWidth=6; c.lineCap='round'; c.beginPath(); c.moveTo(0,0); c.lineTo(Math.cos(lock.a)*165,Math.sin(lock.a)*165); c.stroke();
    c.fillStyle='#2c2e33'; c.beginPath(); c.arc(0,0,34,0,7); c.fill();
    for(let i=0;i<3;i++){c.fillStyle=i<lock.stage?'#86b06f':'#3a3c40'; c.beginPath(); c.arc(-24+i*24,0,7,0,7); c.fill()}
    c.restore(); requestAnimationFrame(draw)};
  requestAnimationFrame(draw);
}

function openDefenseSetup(){
  if(!S.weapons.pistol) return toast('총이 없다. 주차 빌딩 캠프에 합류(Lv.5)하면 권총을 얻을 수 있다.');
  const hp=100+15*S.bld.wall+(setDone(3)?30:0)+(S.route==='solo'?20:0);
  openModal(`<h2>야간 방어전</h2><p class="note" style="margin:0">기본 체력 ${hp}. 죽거나 철수할 때까지 버틴 만큼 보상을 받습니다.</p>
    <label class="row"><input type="checkbox" id="useAmmo" ${S.inv.ammo>0?'checked':'disabled'}> 탄약 상자 사용 (보유 ${S.inv.ammo}, 산탄 +12)</label>
    <label class="row"><input type="checkbox" id="useMed" ${S.inv.medkit>0?'checked':'disabled'}> 구급상자 사용 (보유 ${S.inv.medkit}, 체력 +50)</label>
    <div class="row"><button class="btn pri" id="defGo">출격</button><button class="btn" data-act="closeModal">취소</button></div>`);
  $('defGo').onclick=()=>{
    const ammo=$('useAmmo').checked&&S.inv.ammo>0, med=$('useMed').checked&&S.inv.medkit>0;
    if(ammo) S.inv.ammo--; if(med) S.inv.medkit--; markSave(); closeModal();

  };
}

function gatePerson(){ const z=Math.random()<.45, nm=stPick(GNAMES), mis=z?(Math.random()<.35?stPick(Object.keys(GCHECK)):null):(Math.random()<.4?stPick(Object.keys(GCHECK)):null);
  const clue={}; for(const k in GCHECK){ const bad=z?k!==mis:k===mis; clue[k]=stPick(bad?GCHECK[k].z:GCHECK[k].h) } return {z,nm,clue,seen:{},left:3} }
ACT.gateStart=()=>{ if(Date.now()-(S.gateT||0)<GATE_CD) return toast(`다음 선별까지 ${mmss(GATE_CD-(Date.now()-(S.gateT||0)))}`); if(rt.enc||!$('modal').hidden) return;
  S.gateT=Date.now(); markSave(); rt.gate={i:0,ok:0,saved:0,list:Array.from({length:GATE_N},gatePerson)}; FXL.pre('tense'); gateDraw() };
function gateDraw(msg){ const G=rt.gate; if(!G) return; const p=G.list[G.i]; rt.modalLock=true;
  const html=`<div class="eyebrow">CHECKPOINT <span class="dash"></span> ${G.i+1} / ${GATE_N}</div><h2>${esc(p.nm)}</h2>
    <p class="ch-p">철문 앞에 선 사람. 확인할 수 있는 건 <b class="num">${p.left}</b>번.</p>
    <div class="gate-clues">${Object.keys(GCHECK).map(k=>p.seen[k]?`<div class="gclue"><span class="label">${GCHECK[k].n}</span><p>${esc(p.clue[k])}</p></div>`:'').join('')||'<p class="muted">아직 아무것도 확인하지 않았다.</p>'}</div>
    ${msg?`<p class="gate-msg">${esc(msg)}</p>`:''}
    <div class="row gate-checks">${Object.keys(GCHECK).map(k=>`<button class="btn sm" data-gc="${k}" ${p.seen[k]||p.left<=0?'disabled':''}>${GCHECK[k].n}</button>`).join('')}</div>
    <div class="story-opts gate-dec"><button class="btn opt" data-gd="pass">들여보낸다</button><button class="btn opt" data-gd="iso">격리 구역으로 보낸다</button><button class="btn opt warnb" data-gd="kill">사살한다</button></div>`;
  if($('modal').hidden) openModal(html); else $('mbox').innerHTML=html;

  $('mbox').querySelectorAll('[data-gd]').forEach(b=>b.onclick=()=>{ $('mbox').querySelectorAll('[data-gd],[data-gc]').forEach(x=>x.disabled=true); gateDecide(b.dataset.gd) }) }
function gateDecide(d){ const G=rt.gate, p=G.list[G.i];
  if(p.z&&d!=='kill'){ sfx('scream'); FXL.flash('rgba(180,0,0,.4)',500); FXL.shake(10,500); return gateEnd(false,d==='iso'?`격리 구역에서 비명이 터졌다. ${p.nm}은(는) 감염자였다. 격리 텐트가 무너졌다.`:`${p.nm}이(가) 문 안쪽에서 고개를 꺾었다. 감염자였다.`) }
  let msg; if(p.z){ G.ok++; sfx('gunshot'); msg=`탕. ${p.nm}이(가) 쓰러졌다. 소매 아래로 검은 핏줄이 보였다. 옳았다.` }
  else if(d==='pass'){ G.ok++; G.saved++; sfx('win'); msg=`${p.nm}이(가) 고개를 숙이며 들어왔다. 사람이었다.` }
  else if(d==='iso'){ G.ok++; sfx('tick'); msg=`${p.nm}은(는) 밤새 격리 텐트에서 떨었다. 아침에 멀쩡히 나왔다. 사람이었다.` }
  else { sfx('gunshot'); G.wrong=(G.wrong||0)+1; msg=`탕. 쓰러진 ${p.nm}의 팔은 깨끗했다. 사람이었다.`; FXL.vig(.3) }
  G.i++; if(G.i>=GATE_N) return gateEnd(true,msg); setTimeout(()=>gateDraw(msg),400) }
function gateEnd(win,msg){ const G=rt.gate; rt.gate=null; const fx=[];
  if(win){ const m=G.ok*15+G.saved*10-(G.wrong||0)*20; if(m>0){ addMoney(m); fx.push(`$${m}`) } const x=G.ok*12; addXp(x); fx.push(`XP +${x}`); if(G.saved>=2&&Math.random()<.5){ const c=addCrew('검문소를 통과한 생존자','per'); if(c) fx.push(`대원 합류: ${c.name}`) } if(G.wrong) fx.push(`무고한 사람 ${G.wrong}명 사살`); S.gateWin=(S.gateWin||0)+1; feed(`${S.nick}님이 검문소 선별을 끝까지 해냈습니다`) }
  else { const lose=folLose(.12); fx.push(...lose); S.hp=Math.max(1,S.hp-20); fx.push('체력 -20'); const idle=crewAlive().filter(c=>c.state==='idle'); if(idle.length&&Math.random()<.5){ const c=stPick(idle); c.state='dead'; c.diedAt=Date.now(); fx.push(`대원 ${c.name} 사망`) } }
  $('mbox').innerHTML=`<div class="eyebrow">CHECKPOINT</div><h2>${win?'선별 완료':'검문소 붕괴'}</h2>${msg?`<p class="ch-p">${esc(msg)}</p>`:''}<p class="ch-p">${win?`${GATE_N}명 중 ${G.ok}명을 옳게 판단했다.`:'한 번의 실수로 모든 게 무너졌다.'}</p><ul class="ev-eff">${fx.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><button class="btn pri" id="gOk">확인</button>`;

function safeDg(crew){ if(crew&&crew.length){ const p=crew.reduce((a,c)=>a+power(c),0); return clamp(1+Math.floor(p/14),1,5) } return clamp(1+Math.floor(lvlOf(S.xp)/8),1,5) }
function recNodes(need,crew){ const safe=safeDg(crew), out=[];
  for(const k in MAP){ const n=MAP[k]; if(n.home||!distOpen(DOF[n.d])) continue; let v=0, why='';
    if(RES[need]){ const L=n.loot[need]; if(!L) continue; const T=DTRAIT[n.d]; v=(L[0]+L[1])/2*((T&&T.r&&T.r[need])||1); why=`${RES[need].n} ${L[0]}~${L[1]}` }
    else if(need==='ing'){ v={food:3,shelter:2,med:1.2}[n.t]||0; if(!v) continue; why='식재료가 잘 나옴' }
    else if(need==='junk'){ v={ruin:3,arms:3,cache:2.5,fuel:2}[n.t]||0; if(!v) continue; why='잡동사니가 잘 나옴' }
    else if(MATS[need]){ if(DMAT[n.d]!==need) continue; v=2+(n.danger?1:0); why=`${MATS[need].n} 산지` }
    const over=Math.max(0,n.dg-safe); v=v*(1+n.dg*.12)/(1+over*1.2); out.push({k,v,why:why+` · 위험 ${n.dg}`+(over?' · 버거움':'')}) }
  return out.sort((a,b)=>b.v-a.v).slice(0,3) }

function cevApplyNow(r,e){ const fx=[]; if(r.hp){ S.hp=clamp(S.hp+r.hp,1,maxHp()); fx.push(`체력 ${r.hp>0?'+':''}${r.hp}`) } if(r.mind) fx.push(mindAdd(r.mind)); if(r.hg){ S.hunger=clamp(S.hunger+r.hg,0,100); fx.push(`허기 ${r.hg>0?'+':''}${r.hg}`) }

function cevChain(e){ const ch={k:'cev_'+e.id,n:e.t,tag:e.tag,mood:e.steps[0].mood,s:{}};
  e.steps.forEach((st,i)=>{ ch.s[i?('n'+i):'start']=c=>{ setTimeout(()=>cevFx(st.fx,st.p[0]),200); const pre=c.prev?[c.prev]:[]; c.prev=''; if(c.prevFx&&c.prevFx.length){ toast(c.prevFx.join(' · '),true); c.prevFx=null }

function cevWatch(){ if(!S||!S.intro||!rt.cev.length||S.hp<=0||rt.enc||rt.koOpen) return; S.cevArm=S.cevArm||{}; const l=lvlOf(S.xp);
  for(const e of rt.cev){ if(!cevOk(e)) continue; const T=e.trig; let hit=false;
    if(T.k==='arrive'){ hit=S.pos===T.node&&!S.travel&&rt.cevPos!==S.pos }
    else if(T.k==='stat'){ const p=thrPct(T.stat); if(p>=T.pct+10) S.cevArm[e.id]=1; hit=p<T.pct&&S.cevArm[e.id]!==0; if(hit) S.cevArm[e.id]=0 }
    else if(T.k==='status'){ const on=stOn(T.st); hit=on&&!S.cevArm['s'+e.id]; S.cevArm['s'+e.id]=on?1:0 }
    else if(T.k==='level'){ hit=l>=T.lv&&!S.cevArm['l'+e.id]; if(l>=T.lv) S.cevArm['l'+e.id]=1 }
    if(hit&&(!e.d||e.d===dKey())){ whenFree(()=>{ if(S.hp>0&&!rt.enc) cevRun(e) }); break } }
  rt.cevPos=S.travel?'':S.pos }
setInterval(()=>{ try{ cevWatch() }catch(e){} },1500);
