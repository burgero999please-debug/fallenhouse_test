const _settings2=ACT.settings; ACT.settings=()=>{ _settings2(); { const L0=$('mbox').querySelector('.setlist'); if(L0&&rt.myId){ L0.insertAdjacentHTML('beforeend',`<div class="setrow"><span><b>내 계정 ID</b><small>관리자 등록할 때만 필요해요.</small></span><button class="btn sm ghost" id="myIdBtn" type="button">복사</button></div>`); $('myIdBtn').onclick=()=>{ try{ navigator.clipboard.writeText(rt.myId); toast('계정 ID를 복사했습니다.') }catch(e){ prompt('계정 ID',rt.myId) } } }
  if(L0&&window.FH_AUTH){ L0.insertAdjacentHTML('beforeend',`<div class="setrow"><span><b>계정</b><small>${esc(window.FH_AUTH.email||'')}</small></span><button class="btn sm ghost" id="fhOut" type="button">로그아웃</button></div>`); $('fhOut').onclick=()=>ACT.logout() } } if(!rt.isAdmin) return; const L=$('mbox').querySelector('.setlist'); if(!L) return;
  L.insertAdjacentHTML('afterbegin',`<div class="setrow"><span><b>이벤트 편집기 <span class="tag">관리자</span></b><small>직접 쓴 사건을 서버에 넣고, 언제 어떻게 터질지 정해요. 관리자에게만 보여요.</small></span><button class="btn sm pri" id="cevOpen" type="button">열기</button></div>`);
  $('cevOpen').onclick=()=>cevOpen() };
const optHtml=(map,cur)=>Object.entries(map).map(([k,v])=>`<option value="${esc(k)}" ${String(k)===String(cur)?'selected':''}>${esc(v)}</option>`).join('');
const trigText=e=>{ const T=e.trig; return T.k==='random'?`무작위 · 빈도 ${['','낮음','보통','높음'][T.w]}`:T.k==='arrive'?`${MAP[T.node]?.n||'?'} 도착`:T.k==='stat'?`${{hp:'체력',mind:'정신',hg:'허기'}[T.stat]} ${T.pct}% 미만`:T.k==='status'?`${STS[T.st]?.n||'?'} 걸림`:T.k==='level'?`Lv.${T.lv} 도달`:'관리자 발동' };
function cevOpen(){ if(!rt.isAdmin) return; rt.modalLock=true; openModal(`<div class="eyebrow">ADMIN <span class="dash"></span> EVENT EDITOR</div><h2>이벤트 편집기</h2><p class="note">만든 사건은 서버의 모든 생존자에게 정한 조건대로 나타나요. 고칠 수 있는 사람은 관리자뿐이에요.</p>
  <div class="row"><button class="btn pri" id="cevNew" type="button">새 사건 만들기</button><button class="btn" id="cevClose" type="button">닫기</button></div><div id="cevList" class="cev-list"></div>`);
  $('cevNew').onclick=()=>cevForm(null); $('cevClose').onclick=()=>{ rt.modalLock=false; closeModal() }; cevListDraw() }
function cevListDraw(){ const el=$('cevList'); if(!el) return; if(!rt.db){ el.innerHTML='<p class="muted">공유 서버에 연결되어 있어야 저장할 수 있어요.</p>'; return }
  el.innerHTML=rt.cev.length?rt.cev.map(e=>`<div class="card cev-i${e.on?'':' off'}"><div class="row spread"><h3>${esc(e.t)}</h3><span class="tag">${e.on?'켜짐':'꺼짐'}</span></div><p class="note">${esc(trigText(e))} · ${esc(e.d?DOF[e.d].n:'모든 구역')} · Lv.${e.lv}부터 · ${e.steps.length}단계${e.once?' · 한 사람당 한 번':''}</p>
    <div class="row"><button class="btn sm" data-ce="edit" data-id="${e.id}">고치기</button><button class="btn sm" data-ce="test" data-id="${e.id}">나만 실행</button><button class="btn sm" data-ce="fire" data-id="${e.id}" ${e.on?'':'disabled'}>지금 모두에게 발생</button><button class="btn sm" data-ce="tog" data-id="${e.id}">${e.on?'끄기':'켜기'}</button><button class="btn sm ghost" data-ce="del" data-id="${e.id}">삭제</button></div></div>`).join(''):'<p class="muted">아직 만든 사건이 없어요.</p>';
  el.querySelectorAll('[data-ce]').forEach(b=>b.onclick=async()=>{ const e=rt.cev.find(x=>x.id===b.dataset.id); if(!e) return; const a=b.dataset.ce;
    if(a==='edit') return cevForm(e); if(a==='test'){ rt.modalLock=false; closeModal(); return setTimeout(()=>runChain(cevChain(e)),200) }
    try{ if(a==='tog') await rt.db.doc('cevents/'+e.id).update({on:!e.on});
      else if(a==='fire'){ if(b.dataset.sure!=='1'){ b.dataset.sure='1'; b.textContent='정말 모두에게?'; return } await rt.db.doc('cevents/'+e.id).update({fire:Date.now()}); toast('30분 안에 접속한 모두에게 발생합니다.',true) }
      else if(a==='del'){ if(b.dataset.sure!=='1'){ b.dataset.sure='1'; b.textContent='정말 삭제'; return } await rt.db.doc('cevents/'+e.id).delete() } }catch(err){ toast('저장하지 못했습니다.') } }) }
function resFields(pfx,r,label,nSteps){ r=r||cevRes({}); const go={'-1':'여기서 끝'}; for(let i=0;i<nSteps;i++) go[i]=`단계 ${i+1}로`;
  return `<fieldset class="cev-r"><legend>${label}</legend><label>결과 문장<textarea data-f="${pfx}.t" rows="2" maxlength="600">${esc(r.t)}</textarea></label>
  <div class="cev-g"><label>다음<select data-f="${pfx}.go">${optHtml(go,r.go)}</select></label><label>효과음<select data-f="${pfx}.sfx">${optHtml(CEV_SFX,r.sfx)}</select></label><label>화면 연출<select data-f="${pfx}.fx">${optHtml(CEV_FX,r.fx)}</select></label>
  <label>체력<input type="number" data-f="${pfx}.hp" value="${r.hp}"></label><label>정신<input type="number" data-f="${pfx}.mind" value="${r.mind}"></label><label>허기<input type="number" data-f="${pfx}.hg" value="${r.hg}"></label><label>돈<input type="number" data-f="${pfx}.$" value="${r.$}"></label><label>XP<input type="number" data-f="${pfx}.xp" value="${r.xp}" min="0"></label>
  <label>아이템<select data-f="${pfx}.it"><option value="">없음</option>${optHtml(Object.fromEntries(Object.keys(ITEMS).map(k=>[k,ITEMS[k].n])),r.it)}</select></label><label>개수<input type="number" data-f="${pfx}.iq" value="${r.iq}" min="0" max="20"></label>
  <label>상태 이상 걸기<select data-f="${pfx}.st"><option value="">없음</option>${optHtml(Object.fromEntries(Object.keys(STS).map(k=>[k,STS[k].n])),r.st)}</select></label><label>몇 분<input type="number" data-f="${pfx}.sm" value="${r.sm}" min="0" max="120"></label>
  <label>상태 이상 치료<select data-f="${pfx}.cure"><option value="">없음</option>${optHtml(Object.fromEntries(Object.keys(STS).map(k=>[k,STS[k].n])),r.cure)}</select></label>
  <label>전투<select data-f="${pfx}.z"><option value="">없음</option>${optHtml(Object.fromEntries(Object.keys(ZOMBIES).map(k=>[k,ZOMBIES[k].n])),r.z)}</select></label></div>
  <div class="row cev-chk"><label><input type="checkbox" data-f="${pfx}.crew" ${r.crew?'checked':''}> 대원 합류</label><label><input type="checkbox" data-f="${pfx}.kill" ${r.kill?'checked':''}> 대원 한 명 사망</label><label><input type="checkbox" data-f="${pfx}.move" ${r.move?'checked':''}> 정신을 잃고 다른 곳으로</label></div></fieldset>` }
const blankO=()=>({n:'',ck:'',ok:cevRes({}),no:cevRes({})});
function cevForm(e){ rt.cevE=e?JSON.parse(JSON.stringify(e)):{t:'',tag:'INCIDENT',d:'',lv:1,once:false,trig:{k:'random',w:2,node:'',stat:'hp',pct:30,st:'leg',lv:5},steps:[{p:[],mood:'tense',sfx:'',fx:'',o:[blankO(),blankO()]}]}; rt.cevS=0;
  const draw=()=>{ const D=rt.cevE, si=Math.min(rt.cevS,D.steps.length-1), St=D.steps[si], T=D.trig;
    $('mbox').innerHTML=`<div class="eyebrow">ADMIN <span class="dash"></span> ${e?'EDIT':'NEW'}</div><h2>${e?'사건 고치기':'새 사건'}</h2><form id="cevF" class="cev-f">
    <div class="cev-g"><label class="w2">제목<input data-f="t" maxlength="60" value="${esc(D.t)}" required></label><label>머리말<input data-f="tag" maxlength="24" value="${esc(D.tag)}"></label>
      <label>구역 제한<select data-f="d"><option value="">모든 구역</option>${optHtml(Object.fromEntries(DIST.map(x=>[x.k,x.n])),D.d)}</select></label><label>최소 레벨<input type="number" data-f="lv" value="${D.lv}" min="1" max="100"></label></div>
    <fieldset class="cev-r"><legend>언제 발생하나요</legend><div class="cev-g"><label class="w2">발생 방식<select data-f="trig.k" data-redraw="1">${optHtml(CEV_TRIG,T.k)}</select></label>
      ${T.k==='random'?`<label>빈도<select data-f="trig.w">${optHtml({1:'낮음',2:'보통',3:'높음'},T.w)}</select></label>`:''}
      ${T.k==='arrive'?`<label class="w2">지점<select data-f="trig.node">${DIST.map(x=>`<optgroup label="${esc(x.n)}">${ZDEF[x.k].map(([k])=>`<option value="${k}" ${k===T.node?'selected':''}>${esc(MAP[k].n)}</option>`).join('')}</optgroup>`).join('')}</select></label>`:''}
      ${T.k==='stat'?`<label>수치<select data-f="trig.stat">${optHtml({hp:'체력',mind:'정신',hg:'허기'},T.stat)}</select></label><label>몇 % 미만<input type="number" data-f="trig.pct" value="${T.pct}" min="1" max="99"></label>`:''}
      ${T.k==='status'?`<label>상태 이상<select data-f="trig.st">${optHtml(Object.fromEntries(Object.keys(STS).map(k=>[k,STS[k].n])),T.st)}</select></label>`:''}
      ${T.k==='level'?`<label>레벨<input type="number" data-f="trig.lv" value="${T.lv}" min="1" max="100"></label>`:''}</div>
      <label class="cev-chk"><input type="checkbox" data-f="once" ${D.once?'checked':''}> 한 사람당 한 번만</label>${T.k==='manual'?'<p class="note">저장한 뒤 목록에서 "지금 모두에게 발생"을 누르면 그때 접속해 있거나 30분 안에 들어오는 사람에게 떠요.</p>':''}</fieldset>
    <div class="row cev-tabs">${D.steps.map((_,i)=>`<button type="button" class="chipb${i===si?' on':''}" data-st="${i}">단계 ${i+1}</button>`).join('')}${D.steps.length<8?'<button type="button" class="chipb" id="cevAddS">+ 단계</button>':''}${D.steps.length>1?`<button type="button" class="linkbtn" id="cevRmS">이 단계 빼기</button>`:''}</div>
    <fieldset class="cev-r"><legend>단계 ${si+1} 장면</legend><div class="cev-g"><label>분위기<select data-f="steps.${si}.mood">${optHtml(CEV_MOOD,St.mood)}</select></label><label>효과음<select data-f="steps.${si}.sfx">${optHtml(CEV_SFX,St.sfx)}</select></label><label>화면 연출<select data-f="steps.${si}.fx">${optHtml(CEV_FX,St.fx)}</select></label></div>
      <label>상황 문장 <small class="note">빈 줄로 단락을 나눠요</small><textarea data-f="steps.${si}.p" rows="5" maxlength="3000">${esc(St.p.join('\n\n'))}</textarea></label></fieldset>
    ${St.o.map((o,i)=>`<fieldset class="cev-o"><legend>선택지 ${i+1}${St.o.length>1?` <button type="button" class="linkbtn" data-rm="${i}">빼기</button>`:''}</legend><div class="cev-g"><label class="w2">선택지 문장<input data-f="steps.${si}.o.${i}.n" maxlength="80" value="${esc(o.n)}"></label><label>판정<select data-f="steps.${si}.o.${i}.ck" data-redraw="1">${optHtml(CEV_STAT,o.ck)}</select></label></div>
      ${resFields(`steps.${si}.o.${i}.ok`,o.ok,o.ck?'성공했을 때':'결과',D.steps.length)}${o.ck?resFields(`steps.${si}.o.${i}.no`,o.no,'실패했을 때',D.steps.length):''}</fieldset>`).join('')}
    ${St.o.length<4?'<button type="button" class="btn sm" id="cevAddO">선택지 추가</button>':''}
    <div class="row"><button class="btn pri" type="submit">저장</button><button class="btn" type="button" id="cevBack">목록으로</button></div></form>`;
    const F=$('cevF'); const read=()=>{ F.querySelectorAll('[data-f]').forEach(el=>{ const path=el.dataset.f.split('.'); let o=rt.cevE; for(let i=0;i<path.length-1;i++) o=o[path[i]]; const k=path[path.length-1];
      o[k]=k==='p'?el.value.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean):el.type==='checkbox'?el.checked:el.type==='number'||k==='go'||k==='w'?+el.value:el.value }) };
    F.querySelectorAll('[data-redraw]').forEach(s=>s.onchange=()=>{ read(); draw() });
    F.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{ read(); rt.cevS=+b.dataset.st; draw() });
    const as=$('cevAddS'); if(as) as.onclick=()=>{ read(); rt.cevE.steps.push({p:[],mood:'tense',sfx:'',fx:'',o:[blankO()]}); rt.cevS=rt.cevE.steps.length-1; draw() };
    const rs=$('cevRmS'); if(rs) rs.onclick=()=>{ read(); rt.cevE.steps.splice(si,1); rt.cevS=Math.max(0,si-1); draw() };
    const ad=$('cevAddO'); if(ad) ad.onclick=()=>{ read(); St.o.push(blankO()); draw() };
    F.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ read(); St.o.splice(+b.dataset.rm,1); draw() });
    $('cevBack').onclick=()=>cevOpen();
    F.onsubmit=async ev=>{ ev.preventDefault(); read(); const id=e?e.id:'e'+Date.now().toString(36)+ri(100,999), clean=cevClean(id,Object.assign({},rt.cevE,{at:Date.now(),on:e?e.on:true,fire:e?e.fire:0}));
      if(!clean) return toast('단계마다 선택지를 하나 이상 써 주세요.'); if(!rt.db) return toast('공유 서버에 연결되어 있어야 저장할 수 있어요.');
      const doc=Object.assign({},clean); delete doc.id; try{ await rt.db.doc('cevents/'+id).set(doc); toast('사건을 저장했습니다.',true); cevOpen() }catch(err){ toast('저장하지 못했습니다. 관리자만 저장할 수 있어요.') } } };
  draw() }

/* 테스트 서버(이메일 계정)일 때: 상단 로그아웃 버튼 */
ACT.logout=()=>{ if(!window.FH_AUTH) return; openModal(`<div class="eyebrow">ACCOUNT</div><h2>로그아웃할까요?</h2><p class="ch-p">${esc(window.FH_AUTH.email||'')} 계정에서 나가요. 지금까지의 진행은 서버에 저장돼서, 다시 로그인하면 폰·컴퓨터 어디서든 이어져요.</p><div class="row"><button class="btn pri" id="outOk">로그아웃</button><button class="btn" data-act="closeModal">취소</button></div>`);
  $('outOk').onclick=async()=>{ $('outOk').disabled=true; $('outOk').textContent='저장하는 중…'; try{ saveLocal(); rt.saveDirty=true; await flushSave() }catch(e){} window.FH_AUTH.signOut() } };
if(window.FH_AUTH){ const sb=$('setBtn'); if(sb&&!$('outBtn')){ const b=document.createElement('button'); b.className='iconbtn outbtn'; b.id='outBtn'; b.dataset.act='logout'; b.setAttribute('aria-label','로그아웃'); b.innerHTML='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span>로그아웃</span>'; sb.after(b) } }
/* ================= 시작 ================= */
{const l=loadLocal(); rt.hadLocal=!!l; rt.localT=l&&l.t||0; S=fixSave(l)}
{const r=offline(Date.now()-(S.t||Date.now())); S.t=Date.now(); render(); renderChat(true); if(r) setTimeout(()=>offlineToast(r),300)}
let lastTick=performance.now();
setInterval(()=>{const now=performance.now(); const dt=Math.min(5,(now-lastTick)/1000); lastTick=now; step(dt); restTick(dt); regenTick(dt); if(S.hp<=0&&!S.rest&&!rt.koOpen&&!rt.enc&&S.intro) knockedOut(); S.t=Date.now(); rt.saveDirty=true;
  if(!rt.saveTimer) rt.saveTimer=setTimeout(flushSave,30000); live(); if(rt.db){ watchDrop(); watchRaids() } if(Math.random()<.2) saveLocal()},1000);
setInterval(()=>{ if(rt.tab!=='defense'&&$('modal').hidden&&!inputFocused()) render() },15000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){flushSave(); if(rt.pubTimer) flushPub()}});
addEventListener('pagehide',()=>{S.t=Date.now();saveLocal()});
{let done=false; const tryIntro=()=>{if(done) return; done=true; if(!S.intro) Intro.open(false); else if(!S.statInit){ S.statInit=true; S.statPts=(S.statPts||0)+8+3*(lvlOf(S.xp)-1); markSave(); setTab('char'); toast('새 시스템: 스탯 포인트를 배분하세요',true) }}; connect().then(tryIntro,tryIntro); setTimeout(tryIntro,2500)}
})();
</script>
